<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1730" viewBox="0 0 1120 1730" role="img"><title>01-Networking-Overview — visual atlas</title><rect width="1120" height="1730" rx="14" fill="#0f172a"/><g font-family="Arial,sans-serif" fill="#f8fafc"><text x="28" y="39" font-size="25" font-weight="bold">01 Networking Overview</text><text x="28" y="65" font-size="15" fill="#a5b4c9">Original educational diagrams • static reference • conceptual examples</text><g transform="translate(15 85)"><rect width="540" height="312" rx="12" fill="#172235" stroke="#41536d"/><text x="18" y="29" font-size="19" font-weight="bold">1. Star topology</text><g transform="translate(20 48)"><path d="M250 115 L250 38" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 115 L425 115" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 115 L250 192" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 115 L75 115.00000000000001" stroke="#6ee7b7" stroke-width="2"  fill="none"/><rect x="218" y="103" width="64" height="24" rx="5" fill="#0f172a" stroke="#a78bfa"/><text x="250" y="119" text-anchor="middle" font-size="11.5">Switch</text><rect x="218" y="26" width="64" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="250" y="42" text-anchor="middle" font-size="11.5">PC</text><rect x="393" y="103" width="64" height="24" rx="5" fill="#0f172a" stroke="#22d3ee"/><text x="425" y="119" text-anchor="middle" font-size="11.5">Laptop</text><rect x="218" y="180" width="64" height="24" rx="5" fill="#0f172a" stroke="#34d399"/><text x="250" y="196" text-anchor="middle" font-size="11.5">Printer</text><rect x="43" y="103.00000000000001" width="64" height="24" rx="5" fill="#0f172a" stroke="#a78bfa"/><text x="75" y="119.00000000000001" text-anchor="middle" font-size="11.5">Server</text></g><text x="18" y="269" font-size="13" fill="#cbd5e1">Each endpoint has its own link to the central switch.</text></g><g transform="translate(565 85)"><rect width="540" height="312" rx="12" fill="#172235" stroke="#41536d"/><text x="18" y="29" font-size="19" font-weight="bold">2. Full mesh</text><g transform="translate(20 48)"><path d="M250 38 L405 115" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 38 L250 192" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 38 L95 115.00000000000001" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M405 115 L250 192" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M405 115 L95 115.00000000000001" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 192 L95 115.00000000000001" stroke="#6ee7b7" stroke-width="2"  fill="none"/><rect x="216" y="26" width="68" height="24" rx="5" fill="#0f172a" stroke="#a78bfa"/><text x="250" y="42" text-anchor="middle" font-size="11.5">Router A</text><rect x="371" y="103" width="68" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="405" y="119" text-anchor="middle" font-size="11.5">Router B</text><rect x="216" y="180" width="68" height="24" rx="5" fill="#0f172a" stroke="#22d3ee"/><text x="250" y="196" text-anchor="middle" font-size="11.5">Router C</text><rect x="61" y="103.00000000000001" width="68" height="24" rx="5" fill="#0f172a" stroke="#34d399"/><text x="95" y="119.00000000000001" text-anchor="middle" font-size="11.5">Router D</text></g><text x="18" y="269" font-size="13" fill="#cbd5e1">Every pair has a direct link; four nodes need six links.</text></g><g transform="translate(15 411)"><rect width="540" height="312" rx="12" fill="#172235" stroke="#41536d"/><text x="18" y="29" font-size="19" font-weight="bold">3. Tree topology</text><g transform="translate(20 48)"><path d="M250 30 L125 100" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 30 L375 100" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M125 100 L65 182" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M125 100 L185 182" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M375 100 L315 182" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M375 100 L435 182" stroke="#6ee7b7" stroke-width="2"  fill="none"/><rect x="218" y="18" width="64" height="24" rx="5" fill="#0f172a" stroke="#a78bfa"/><text x="250" y="34" text-anchor="middle" font-size="11.5">Core</text><rect x="71.5" y="88" width="107" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="125" y="104" text-anchor="middle" font-size="11.5">Distribution A</text><rect x="321.5" y="88" width="107" height="24" rx="5" fill="#0f172a" stroke="#22d3ee"/><text x="375" y="104" text-anchor="middle" font-size="11.5">Distribution B</text><rect x="27.75" y="170" width="74.5" height="24" rx="5" fill="#0f172a" stroke="#34d399"/><text x="65" y="186" text-anchor="middle" font-size="11.5">Access A1</text><rect x="147.75" y="170" width="74.5" height="24" rx="5" fill="#0f172a" stroke="#a78bfa"/><text x="185" y="186" text-anchor="middle" font-size="11.5">Access A2</text><rect x="277.75" y="170" width="74.5" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="315" y="186" text-anchor="middle" font-size="11.5">Access B1</text><rect x="397.75" y="170" width="74.5" height="24" rx="5" fill="#0f172a" stroke="#22d3ee"/><text x="435" y="186" text-anchor="middle" font-size="11.5">Access B2</text></g><text x="18" y="269" font-size="13" fill="#cbd5e1">Core, distribution and access roles organize a hierarchy.</text></g><g transform="translate(565 411)"><rect width="540" height="312" rx="12" fill="#172235" stroke="#41536d"/><text x="18" y="29" font-size="19" font-weight="bold">4. Flat LAN</text><g transform="translate(20 48)"><path d="M250 115 L250 38" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 115 L425 115" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 115 L250 192" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 115 L75 115.00000000000001" stroke="#6ee7b7" stroke-width="2"  fill="none"/><rect x="199.75" y="103" width="100.5" height="24" rx="5" fill="#0f172a" stroke="#a78bfa"/><text x="250" y="119" text-anchor="middle" font-size="11.5">Shared switch</text><rect x="218" y="26" width="64" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="250" y="42" text-anchor="middle" font-size="11.5">Printer</text><rect x="381.25" y="103" width="87.5" height="24" rx="5" fill="#0f172a" stroke="#22d3ee"/><text x="425" y="119" text-anchor="middle" font-size="11.5">Workstation</text><rect x="216" y="180" width="68" height="24" rx="5" fill="#0f172a" stroke="#34d399"/><text x="250" y="196" text-anchor="middle" font-size="11.5">Database</text><rect x="41" y="103.00000000000001" width="68" height="24" rx="5" fill="#0f172a" stroke="#a78bfa"/><text x="75" y="119.00000000000001" text-anchor="middle" font-size="11.5">Admin PC</text></g><text x="18" y="269" font-size="13" fill="#cbd5e1">Shared trust and broadcast domains can increase exposure.</text></g><g transform="translate(15 737)"><rect width="540" height="312" rx="12" fill="#172235" stroke="#41536d"/><text x="18" y="29" font-size="19" font-weight="bold">5. Segmented LAN</text><g transform="translate(20 48)"><path d="M250 115 L250 38" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 115 L425 115" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 115 L250 192" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 115 L75 115.00000000000001" stroke="#6ee7b7" stroke-width="2"  fill="none"/><rect x="186.75" y="103" width="126.5" height="24" rx="5" fill="#0f172a" stroke="#a78bfa"/><text x="250" y="119" text-anchor="middle" font-size="11.5">Firewall / router</text><rect x="203" y="26" width="94" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="250" y="42" text-anchor="middle" font-size="11.5">Printer VLAN</text><rect x="378" y="103" width="94" height="24" rx="5" fill="#0f172a" stroke="#22d3ee"/><text x="425" y="119" text-anchor="middle" font-size="11.5">Student VLAN</text><rect x="199.75" y="180" width="100.5" height="24" rx="5" fill="#0f172a" stroke="#34d399"/><text x="250" y="196" text-anchor="middle" font-size="11.5">Database zone</text><rect x="34.5" y="103.00000000000001" width="81" height="24" rx="5" fill="#0f172a" stroke="#a78bfa"/><text x="75" y="119.00000000000001" text-anchor="middle" font-size="11.5">Management</text></g><text x="18" y="269" font-size="13" fill="#cbd5e1">Firewall policy restricts inter-zone traffic.</text></g><g transform="translate(565 737)"><rect width="540" height="312" rx="12" fill="#172235" stroke="#41536d"/><text x="18" y="29" font-size="19" font-weight="bold">6. Subnet mask mismatch</text><g transform="translate(20 48)"><path d="M250 25 L120 95" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 25 L380 95" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M120 95 L95 180" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M380 95 L315 180" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M380 95 L435 180" stroke="#6ee7b7" stroke-width="2"  fill="none"/><rect x="196.5" y="13" width="107" height="24" rx="5" fill="#0f172a" stroke="#a78bfa"/><text x="250" y="29" text-anchor="middle" font-size="11.5">Routing policy</text><rect x="73" y="83" width="94" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="120" y="99" text-anchor="middle" font-size="11.5">10.20.0.1/25</text><rect x="326.5" y="83" width="107" height="24" rx="5" fill="#0f172a" stroke="#22d3ee"/><text x="380" y="99" text-anchor="middle" font-size="11.5">10.20.0.129/25</text><rect x="57.75" y="168" width="74.5" height="24" rx="5" fill="#0f172a" stroke="#34d399"/><text x="95" y="184" text-anchor="middle" font-size="11.5">DC .10/25</text><rect x="274.5" y="168" width="81" height="24" rx="5" fill="#0f172a" stroke="#a78bfa"/><text x="315" y="184" text-anchor="middle" font-size="11.5">PC .200/25</text><rect x="381.5" y="168" width="107" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="435" y="184" text-anchor="middle" font-size="11.5">Tester .252/24</text></g><text x="18" y="269" font-size="13" fill="#cbd5e1">Tester /24 misidentifies addresses in the other /25 as on-link.</text></g><g transform="translate(15 1063)"><rect width="540" height="312" rx="12" fill="#172235" stroke="#41536d"/><text x="18" y="29" font-size="19" font-weight="bold">7. Home to company</text><g transform="translate(20 48)"><path d="M55 110 L152.5 110" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M152.5 110 L250 110" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 110 L347.5 110" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M347.5 110 L445 110" stroke="#6ee7b7" stroke-width="2"  fill="none"/><rect x="17.75" y="98" width="74.5" height="24" rx="5" fill="#0f172a" stroke="#a78bfa"/><text x="55" y="114" text-anchor="middle" font-size="11.5">Home host</text><rect x="108.75" y="98" width="87.5" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="152.5" y="114" text-anchor="middle" font-size="11.5">Home router</text><rect x="212.75" y="98" width="74.5" height="24" rx="5" fill="#0f172a" stroke="#22d3ee"/><text x="250" y="114" text-anchor="middle" font-size="11.5">ISP / WAN</text><rect x="313.5" y="98" width="68" height="24" rx="5" fill="#0f172a" stroke="#34d399"/><text x="347.5" y="114" text-anchor="middle" font-size="11.5">Firewall</text><rect x="404.5" y="98" width="81" height="24" rx="5" fill="#0f172a" stroke="#a78bfa"/><text x="445" y="114" text-anchor="middle" font-size="11.5">Web server</text></g><text x="18" y="269" font-size="13" fill="#cbd5e1">ISP and company firewall connect otherwise separate networks.</text></g><g transform="translate(565 1063)"><rect width="540" height="312" rx="12" fill="#172235" stroke="#41536d"/><text x="18" y="29" font-size="19" font-weight="bold">8. DNS and HTTP</text><g transform="translate(20 48)"><path d="M55 110 L185 110" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M185 110 L315 110" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M315 110 L445 110" stroke="#6ee7b7" stroke-width="2"  fill="none"/><rect x="23" y="98" width="64" height="24" rx="5" fill="#0f172a" stroke="#a78bfa"/><text x="55" y="114" text-anchor="middle" font-size="11.5">Browser</text><rect x="138" y="98" width="94" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="185" y="114" text-anchor="middle" font-size="11.5">DNS resolver</text><rect x="277.75" y="98" width="74.5" height="24" rx="5" fill="#0f172a" stroke="#22d3ee"/><text x="315" y="114" text-anchor="middle" font-size="11.5">IP result</text><rect x="398" y="98" width="94" height="24" rx="5" fill="#0f172a" stroke="#34d399"/><text x="445" y="114" text-anchor="middle" font-size="11.5">HTTPS server</text></g><text x="18" y="269" font-size="13" fill="#cbd5e1">Name resolution precedes a fresh web connection when needed.</text></g><g transform="translate(15 1389)"><rect width="540" height="312" rx="12" fill="#172235" stroke="#41536d"/><text x="18" y="29" font-size="19" font-weight="bold">9. Protected network zones</text><g transform="translate(20 48)"><path d="M250 115 L250 38" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 115 L416.43489035165186 91.20569143312905" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 115 L352.8624191511828 177.29430856687094" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 115 L147.1375808488172 177.29430856687094" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 115 L83.56510964834811 91.20569143312906" stroke="#6ee7b7" stroke-width="2"  fill="none"/><rect x="216" y="103" width="68" height="24" rx="5" fill="#0f172a" stroke="#a78bfa"/><text x="250" y="119" text-anchor="middle" font-size="11.5">Firewall</text><rect x="218" y="26" width="64" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="250" y="42" text-anchor="middle" font-size="11.5">Web DMZ</text><rect x="369.43489035165186" y="79.20569143312905" width="94" height="24" rx="5" fill="#0f172a" stroke="#22d3ee"/><text x="416.43489035165186" y="95.20569143312905" text-anchor="middle" font-size="11.5">Workstations</text><rect x="320.8624191511828" y="165.29430856687094" width="64" height="24" rx="5" fill="#0f172a" stroke="#34d399"/><text x="352.8624191511828" y="181.29430856687094" text-anchor="middle" font-size="11.5">Admin</text><rect x="115.13758084881721" y="165.29430856687094" width="64" height="24" rx="5" fill="#0f172a" stroke="#a78bfa"/><text x="147.1375808488172" y="181.29430856687094" text-anchor="middle" font-size="11.5">Voice</text><rect x="49.56510964834811" y="79.20569143312906" width="68" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="83.56510964834811" y="95.20569143312906" text-anchor="middle" font-size="11.5">Printers</text></g><text x="18" y="269" font-size="13" fill="#cbd5e1">Zones separate trust; access requires an approved policy.</text></g><g transform="translate(565 1389)"><rect width="540" height="312" rx="12" fill="#172235" stroke="#41536d"/><text x="18" y="29" font-size="19" font-weight="bold">10. UniTrack access architecture</text><g transform="translate(20 48)"><path d="M75 25 L250 105" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 25 L250 105" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M425 25 L250 105" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 105 L250 190" stroke="#6ee7b7" stroke-width="2"  fill="none"/><rect x="43" y="13" width="64" height="24" rx="5" fill="#0f172a" stroke="#a78bfa"/><text x="75" y="29" text-anchor="middle" font-size="11.5">Student</text><rect x="218" y="13" width="64" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="250" y="29" text-anchor="middle" font-size="11.5">Scanner</text><rect x="393" y="13" width="64" height="24" rx="5" fill="#0f172a" stroke="#22d3ee"/><text x="425" y="29" text-anchor="middle" font-size="11.5">Admin</text><rect x="212.75" y="93" width="74.5" height="24" rx="5" fill="#0f172a" stroke="#34d399"/><text x="250" y="109" text-anchor="middle" font-size="11.5">HTTPS API</text><rect x="209.5" y="178" width="81" height="24" rx="5" fill="#0f172a" stroke="#a78bfa"/><text x="250" y="194" text-anchor="middle" font-size="11.5">Private DB</text></g><text x="18" y="269" font-size="13" fill="#cbd5e1">Role-specific HTTPS access; database not directly exposed.</text></g></g></svg>