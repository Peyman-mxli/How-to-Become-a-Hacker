<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1730" viewBox="0 0 1120 1730" role="img"><title>04-Proxies — visual atlas</title><rect width="1120" height="1730" rx="14" fill="#0f172a"/><g font-family="Arial,sans-serif" fill="#f8fafc"><text x="28" y="39" font-size="25" font-weight="bold">04 Proxies</text><text x="28" y="65" font-size="15" fill="#a5b4c9">Original educational diagrams • static reference • conceptual examples</text><g transform="translate(15 85)"><rect width="540" height="312" rx="12" fill="#172235" stroke="#41536d"/><text x="18" y="29" font-size="19" font-weight="bold">1. Proxy mediation</text><g transform="translate(20 48)"><path d="M55 110 L250 110" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 110 L445 110" stroke="#6ee7b7" stroke-width="2"  fill="none"/><rect x="23" y="98" width="64" height="24" rx="5" fill="#0f172a" stroke="#a78bfa"/><text x="55" y="114" text-anchor="middle" font-size="11.5">Client</text><rect x="218" y="98" width="64" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="250" y="114" text-anchor="middle" font-size="11.5">Proxy</text><rect x="413" y="98" width="64" height="24" rx="5" fill="#0f172a" stroke="#22d3ee"/><text x="445" y="114" text-anchor="middle" font-size="11.5">Server</text></g><text x="18" y="269" font-size="13" fill="#cbd5e1">Intermediary handles communication on behalf of another party.</text></g><g transform="translate(565 85)"><rect width="540" height="312" rx="12" fill="#172235" stroke="#41536d"/><text x="18" y="29" font-size="19" font-weight="bold">2. Forward proxy</text><g transform="translate(20 48)"><path d="M70 50 L250 110" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M70 170 L250 110" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 110 L430 110" stroke="#6ee7b7" stroke-width="2"  fill="none"/><rect x="38" y="38" width="64" height="24" rx="5" fill="#0f172a" stroke="#a78bfa"/><text x="70" y="54" text-anchor="middle" font-size="11.5">Host A</text><rect x="38" y="158" width="64" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="70" y="174" text-anchor="middle" font-size="11.5">Host B</text><rect x="199.75" y="98" width="100.5" height="24" rx="5" fill="#0f172a" stroke="#22d3ee"/><text x="250" y="114" text-anchor="middle" font-size="11.5">Forward proxy</text><rect x="389.5" y="98" width="81" height="24" rx="5" fill="#0f172a" stroke="#34d399"/><text x="430" y="114" text-anchor="middle" font-size="11.5">Web server</text></g><text x="18" y="269" font-size="13" fill="#cbd5e1">Acts for clients, enforcing approved outbound access.</text></g><g transform="translate(15 411)"><rect width="540" height="312" rx="12" fill="#172235" stroke="#41536d"/><text x="18" y="29" font-size="19" font-weight="bold">3. Reverse proxy</text><g transform="translate(20 48)"><path d="M100 25 L250 100" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M400 25 L250 100" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 100 L75 190" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 100 L250 190" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 100 L425 190" stroke="#6ee7b7" stroke-width="2"  fill="none"/><rect x="66" y="13" width="68" height="24" rx="5" fill="#0f172a" stroke="#a78bfa"/><text x="100" y="29" text-anchor="middle" font-size="11.5">Client A</text><rect x="366" y="13" width="68" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="400" y="29" text-anchor="middle" font-size="11.5">Client B</text><rect x="199.75" y="88" width="100.5" height="24" rx="5" fill="#0f172a" stroke="#22d3ee"/><text x="250" y="104" text-anchor="middle" font-size="11.5">Reverse proxy</text><rect x="37.75" y="178" width="74.5" height="24" rx="5" fill="#0f172a" stroke="#34d399"/><text x="75" y="194" text-anchor="middle" font-size="11.5">Backend A</text><rect x="212.75" y="178" width="74.5" height="24" rx="5" fill="#0f172a" stroke="#a78bfa"/><text x="250" y="194" text-anchor="middle" font-size="11.5">Backend B</text><rect x="387.75" y="178" width="74.5" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="425" y="194" text-anchor="middle" font-size="11.5">Backend C</text></g><text x="18" y="269" font-size="13" fill="#cbd5e1">Acts for backend services; incoming clients use edge address.</text></g><g transform="translate(565 411)"><rect width="540" height="312" rx="12" fill="#172235" stroke="#41536d"/><text x="18" y="29" font-size="19" font-weight="bold">4. Burp Proxy</text><g transform="translate(20 48)"><path d="M55 110 L250 110" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 110 L445 110" stroke="#6ee7b7" stroke-width="2"  fill="none"/><rect x="23" y="98" width="64" height="24" rx="5" fill="#0f172a" stroke="#a78bfa"/><text x="55" y="114" text-anchor="middle" font-size="11.5">Browser</text><rect x="209.5" y="98" width="81" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="250" y="114" text-anchor="middle" font-size="11.5">Burp Proxy</text><rect x="407.75" y="98" width="74.5" height="24" rx="5" fill="#0f172a" stroke="#22d3ee"/><text x="445" y="114" text-anchor="middle" font-size="11.5">Owned app</text></g><text x="18" y="269" font-size="13" fill="#cbd5e1">Dedicated testing browser communicates with owned application.</text></g><g transform="translate(15 737)"><rect width="540" height="312" rx="12" fill="#172235" stroke="#41536d"/><text x="18" y="29" font-size="19" font-weight="bold">5. Cloudflare TLS</text><g transform="translate(20 48)"><path d="M55 110 L250 110" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 110 L445 110" stroke="#6ee7b7" stroke-width="2"  fill="none"/><rect x="23" y="98" width="64" height="24" rx="5" fill="#0f172a" stroke="#a78bfa"/><text x="55" y="114" text-anchor="middle" font-size="11.5">Visitor</text><rect x="209.5" y="98" width="81" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="250" y="114" text-anchor="middle" font-size="11.5">Edge proxy</text><rect x="413" y="98" width="64" height="24" rx="5" fill="#0f172a" stroke="#22d3ee"/><text x="445" y="114" text-anchor="middle" font-size="11.5">Origin</text></g><text x="18" y="269" font-size="13" fill="#cbd5e1">Two TLS connections when edge terminates HTTPS.</text></g><g transform="translate(565 737)"><rect width="540" height="312" rx="12" fill="#172235" stroke="#41536d"/><text x="18" y="29" font-size="19" font-weight="bold">6. WAF decision</text><g transform="translate(20 48)"><path d="M250 25 L250 100" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 100 L125 185" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 100 L375 185" stroke="#6ee7b7" stroke-width="2"  fill="none"/><rect x="203" y="13" width="94" height="24" rx="5" fill="#0f172a" stroke="#a78bfa"/><text x="250" y="29" text-anchor="middle" font-size="11.5">HTTP request</text><rect x="186.75" y="88" width="126.5" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="250" y="104" text-anchor="middle" font-size="11.5">ModSecurity / CRS</text><rect x="68.25" y="173" width="113.5" height="24" rx="5" fill="#0f172a" stroke="#22d3ee"/><text x="125" y="189" text-anchor="middle" font-size="11.5">Allowed backend</text><rect x="331.25" y="173" width="87.5" height="24" rx="5" fill="#0f172a" stroke="#34d399"/><text x="375" y="189" text-anchor="middle" font-size="11.5">Block / log</text></g><text x="18" y="269" font-size="13" fill="#cbd5e1">Evaluate request; allow, block or log per configured policy.</text></g><g transform="translate(15 1063)"><rect width="540" height="312" rx="12" fill="#172235" stroke="#41536d"/><text x="18" y="29" font-size="19" font-weight="bold">7. Explicit proxy</text><g transform="translate(20 48)"><path d="M55 110 L250 110" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 110 L445 110" stroke="#6ee7b7" stroke-width="2"  fill="none"/><rect x="-8.25" y="98" width="126.5" height="24" rx="5" fill="#0f172a" stroke="#a78bfa"/><text x="55" y="114" text-anchor="middle" font-size="11.5">Configured client</text><rect x="196.5" y="98" width="107" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="250" y="114" text-anchor="middle" font-size="11.5">Explicit proxy</text><rect x="401.25" y="98" width="87.5" height="24" rx="5" fill="#0f172a" stroke="#22d3ee"/><text x="445" y="114" text-anchor="middle" font-size="11.5">Destination</text></g><text x="18" y="269" font-size="13" fill="#cbd5e1">Client is configured with proxy address.</text></g><g transform="translate(565 1063)"><rect width="540" height="312" rx="12" fill="#172235" stroke="#41536d"/><text x="18" y="29" font-size="19" font-weight="bold">8. Interception proxy</text><g transform="translate(20 48)"><path d="M55 110 L185 110" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M185 110 L315 110" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M315 110 L445 110" stroke="#6ee7b7" stroke-width="2"  fill="none"/><rect x="23" y="98" width="64" height="24" rx="5" fill="#0f172a" stroke="#a78bfa"/><text x="55" y="114" text-anchor="middle" font-size="11.5">Client</text><rect x="131.5" y="98" width="107" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="185" y="114" text-anchor="middle" font-size="11.5">Network policy</text><rect x="283" y="98" width="64" height="24" rx="5" fill="#0f172a" stroke="#22d3ee"/><text x="315" y="114" text-anchor="middle" font-size="11.5">Proxy</text><rect x="401.25" y="98" width="87.5" height="24" rx="5" fill="#0f172a" stroke="#34d399"/><text x="445" y="114" text-anchor="middle" font-size="11.5">Destination</text></g><text x="18" y="269" font-size="13" fill="#cbd5e1">Network policy redirects traffic without explicit client setup.</text></g><g transform="translate(15 1389)"><rect width="540" height="312" rx="12" fill="#172235" stroke="#41536d"/><text x="18" y="29" font-size="19" font-weight="bold">9. SSH channel</text><g transform="translate(20 48)"><path d="M55 110 L250 110" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 110 L445 110" stroke="#6ee7b7" stroke-width="2"  fill="none"/><rect x="14.5" y="98" width="81" height="24" rx="5" fill="#0f172a" stroke="#a78bfa"/><text x="55" y="114" text-anchor="middle" font-size="11.5">SSH client</text><rect x="186.75" y="98" width="126.5" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="250" y="114" text-anchor="middle" font-size="11.5">Encrypted channel</text><rect x="404.5" y="98" width="81" height="24" rx="5" fill="#0f172a" stroke="#22d3ee"/><text x="445" y="114" text-anchor="middle" font-size="11.5">SSH server</text></g><text x="18" y="269" font-size="13" fill="#cbd5e1">Encrypted authenticated communication for approved remote access.</text></g><g transform="translate(565 1389)"><rect width="540" height="312" rx="12" fill="#172235" stroke="#41536d"/><text x="18" y="29" font-size="19" font-weight="bold">10. UniTrack reverse proxy and WAF</text><g transform="translate(20 48)"><path d="M250 40 L250 77.5" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 77.5 L250 115" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 115 L250 152.5" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 152.5 L250 190" stroke="#6ee7b7" stroke-width="2"  fill="none"/><rect x="199.75" y="28" width="100.5" height="24" rx="5" fill="#0f172a" stroke="#a78bfa"/><text x="250" y="44" text-anchor="middle" font-size="11.5">HTTPS clients</text><rect x="180.25" y="65.5" width="139.5" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="250" y="81.5" text-anchor="middle" font-size="11.5">NGINX reverse proxy</text><rect x="186.75" y="103" width="126.5" height="24" rx="5" fill="#0f172a" stroke="#22d3ee"/><text x="250" y="119" text-anchor="middle" font-size="11.5">ModSecurity / CRS</text><rect x="199.75" y="140.5" width="100.5" height="24" rx="5" fill="#0f172a" stroke="#34d399"/><text x="250" y="156.5" text-anchor="middle" font-size="11.5">Flask backend</text><rect x="190" y="178" width="120" height="24" rx="5" fill="#0f172a" stroke="#a78bfa"/><text x="250" y="194" text-anchor="middle" font-size="11.5">Private database</text></g><text x="18" y="269" font-size="13" fill="#cbd5e1">Conceptual defense in depth; WAF may be integrated in edge.</text></g></g></svg>