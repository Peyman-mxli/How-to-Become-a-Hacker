<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1730" viewBox="0 0 1120 1730" role="img"><title>05-Networking-Models — visual atlas</title><rect width="1120" height="1730" rx="14" fill="#0f172a"/><g font-family="Arial,sans-serif" fill="#f8fafc"><text x="28" y="39" font-size="25" font-weight="bold">05 Networking Models</text><text x="28" y="65" font-size="15" fill="#a5b4c9">Original educational diagrams • static reference • conceptual examples</text><g transform="translate(15 85)"><rect width="540" height="312" rx="12" fill="#172235" stroke="#41536d"/><text x="18" y="29" font-size="19" font-weight="bold">1. OSI and TCP/IP mapping</text><g transform="translate(20 48)"><path d="M120 20 L380 51" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M120 51 L380 51" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M120 82 L380 51" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M120 113 L380 113" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M120 144 L380 144" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M120 175 L380 190" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M120 206 L380 190" stroke="#6ee7b7" stroke-width="2"  fill="none"/><rect x="69.75" y="8" width="100.5" height="24" rx="5" fill="#0f172a" stroke="#a78bfa"/><text x="120" y="24" text-anchor="middle" font-size="11.5">7 Application</text><rect x="66.5" y="39" width="107" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="120" y="55" text-anchor="middle" font-size="11.5">6 Presentation</text><rect x="82.75" y="70" width="74.5" height="24" rx="5" fill="#0f172a" stroke="#22d3ee"/><text x="120" y="86" text-anchor="middle" font-size="11.5">5 Session</text><rect x="76.25" y="101" width="87.5" height="24" rx="5" fill="#0f172a" stroke="#34d399"/><text x="120" y="117" text-anchor="middle" font-size="11.5">4 Transport</text><rect x="82.75" y="132" width="74.5" height="24" rx="5" fill="#0f172a" stroke="#a78bfa"/><text x="120" y="148" text-anchor="middle" font-size="11.5">3 Network</text><rect x="76.25" y="163" width="87.5" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="120" y="179" text-anchor="middle" font-size="11.5">2 Data Link</text><rect x="79.5" y="194" width="81" height="24" rx="5" fill="#0f172a" stroke="#22d3ee"/><text x="120" y="210" text-anchor="middle" font-size="11.5">1 Physical</text><rect x="336.25" y="39" width="87.5" height="24" rx="5" fill="#0f172a" stroke="#34d399"/><text x="380" y="55" text-anchor="middle" font-size="11.5">Application</text><rect x="342.75" y="101" width="74.5" height="24" rx="5" fill="#0f172a" stroke="#a78bfa"/><text x="380" y="117" text-anchor="middle" font-size="11.5">Transport</text><rect x="346" y="132" width="68" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="380" y="148" text-anchor="middle" font-size="11.5">Internet</text><rect x="348" y="178" width="64" height="24" rx="5" fill="#0f172a" stroke="#22d3ee"/><text x="380" y="194" text-anchor="middle" font-size="11.5">Link</text></g><text x="18" y="269" font-size="13" fill="#cbd5e1">OSI 7–5 -&gt; Application; 4 -&gt; Transport; 3 -&gt; Internet; 2–1 -&gt; Link.</text></g><g transform="translate(565 85)"><rect width="540" height="312" rx="12" fill="#172235" stroke="#41536d"/><text x="18" y="29" font-size="19" font-weight="bold">2. Presentation example</text><g transform="translate(20 48)"><path d="M55 110 L250 110" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 110 L445 110" stroke="#6ee7b7" stroke-width="2"  fill="none"/><rect x="23" y="98" width="64" height="24" rx="5" fill="#0f172a" stroke="#a78bfa"/><text x="55" y="114" text-anchor="middle" font-size="11.5">Hello</text><rect x="193.25" y="98" width="113.5" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="250" y="114" text-anchor="middle" font-size="11.5">Base64 encoding</text><rect x="411" y="98" width="68" height="24" rx="5" fill="#0f172a" stroke="#22d3ee"/><text x="445" y="114" text-anchor="middle" font-size="11.5">SGVsbG8=</text></g><text x="18" y="269" font-size="13" fill="#cbd5e1">Base64 represents bytes; it is not encryption.</text></g><g transform="translate(15 411)"><rect width="540" height="312" rx="12" fill="#172235" stroke="#41536d"/><text x="18" y="29" font-size="19" font-weight="bold">3. Session lifecycle</text><g transform="translate(20 48)"><path d="M55 110 L185 110" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M185 110 L315 110" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M315 110 L445 110" stroke="#6ee7b7" stroke-width="2"  fill="none"/><rect x="17.75" y="98" width="74.5" height="24" rx="5" fill="#0f172a" stroke="#a78bfa"/><text x="55" y="114" text-anchor="middle" font-size="11.5">Establish</text><rect x="151" y="98" width="68" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="185" y="114" text-anchor="middle" font-size="11.5">Exchange</text><rect x="281" y="98" width="68" height="24" rx="5" fill="#0f172a" stroke="#22d3ee"/><text x="315" y="114" text-anchor="middle" font-size="11.5">Maintain</text><rect x="407.75" y="98" width="74.5" height="24" rx="5" fill="#0f172a" stroke="#34d399"/><text x="445" y="114" text-anchor="middle" font-size="11.5">Terminate</text></g><text x="18" y="269" font-size="13" fill="#cbd5e1">Conceptual dialogue state, not a separate web-cookie protocol.</text></g><g transform="translate(565 411)"><rect width="540" height="312" rx="12" fill="#172235" stroke="#41536d"/><text x="18" y="29" font-size="19" font-weight="bold">4. TCP handshake</text><g transform="translate(20 48)"><path d="M85 30 L250 80" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 80 L415 30" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M415 30 L250 130" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 130 L85 30" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M85 30 L250 185" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 185 L415 30" stroke="#6ee7b7" stroke-width="2"  fill="none"/><rect x="53" y="18" width="64" height="24" rx="5" fill="#0f172a" stroke="#a78bfa"/><text x="85" y="34" text-anchor="middle" font-size="11.5">Client</text><rect x="383" y="18" width="64" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="415" y="34" text-anchor="middle" font-size="11.5">Server</text><rect x="218" y="68" width="64" height="24" rx="5" fill="#0f172a" stroke="#22d3ee"/><text x="250" y="84" text-anchor="middle" font-size="11.5">SYN 100</text><rect x="186.75" y="118" width="126.5" height="24" rx="5" fill="#0f172a" stroke="#34d399"/><text x="250" y="134" text-anchor="middle" font-size="11.5">SYN-ACK 500 / 101</text><rect x="218" y="173" width="64" height="24" rx="5" fill="#0f172a" stroke="#a78bfa"/><text x="250" y="189" text-anchor="middle" font-size="11.5">ACK 501</text></g><text x="18" y="269" font-size="13" fill="#cbd5e1">Illustrative initial sequence numbers; SYN consumes one.</text></g><g transform="translate(15 737)"><rect width="540" height="312" rx="12" fill="#172235" stroke="#41536d"/><text x="18" y="29" font-size="19" font-weight="bold">5. Local MAC delivery</text><g transform="translate(20 48)"><path d="M55 110 L250 110" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 110 L445 110" stroke="#6ee7b7" stroke-width="2"  fill="none"/><rect x="14.5" y="98" width="81" height="24" rx="5" fill="#0f172a" stroke="#a78bfa"/><text x="55" y="114" text-anchor="middle" font-size="11.5">Host A MAC</text><rect x="193.25" y="98" width="113.5" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="250" y="114" text-anchor="middle" font-size="11.5">Ethernet switch</text><rect x="404.5" y="98" width="81" height="24" rx="5" fill="#0f172a" stroke="#22d3ee"/><text x="445" y="114" text-anchor="middle" font-size="11.5">Host B MAC</text></g><text x="18" y="269" font-size="13" fill="#cbd5e1">A switch forwards Ethernet frames on a local link.</text></g><g transform="translate(565 737)"><rect width="540" height="312" rx="12" fill="#172235" stroke="#41536d"/><text x="18" y="29" font-size="19" font-weight="bold">6. PDU and encapsulation</text><g transform="translate(20 48)"><path d="M250 40 L250 77.5" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 77.5 L250 115" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 115 L250 152.5" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 152.5 L250 190" stroke="#6ee7b7" stroke-width="2"  fill="none"/><rect x="190" y="28" width="120" height="24" rx="5" fill="#0f172a" stroke="#a78bfa"/><text x="250" y="44" text-anchor="middle" font-size="11.5">Application data</text><rect x="186.75" y="60.5" width="126.5" height="34" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="250" y="75" text-anchor="middle" font-size="11.5">TCP segment / UDP</text><text x="250" y="88" text-anchor="middle" font-size="11.5">datagram</text><rect x="212.75" y="103" width="74.5" height="24" rx="5" fill="#0f172a" stroke="#22d3ee"/><text x="250" y="119" text-anchor="middle" font-size="11.5">IP packet</text><rect x="196.5" y="140.5" width="107" height="24" rx="5" fill="#0f172a" stroke="#34d399"/><text x="250" y="156.5" text-anchor="middle" font-size="11.5">Ethernet frame</text><rect x="196.5" y="178" width="107" height="24" rx="5" fill="#0f172a" stroke="#a78bfa"/><text x="250" y="194" text-anchor="middle" font-size="11.5">Bits / signals</text></g><text x="18" y="269" font-size="13" fill="#cbd5e1">Not every conceptual layer adds a distinct header.</text></g><g transform="translate(15 1063)"><rect width="540" height="312" rx="12" fill="#172235" stroke="#41536d"/><text x="18" y="29" font-size="19" font-weight="bold">7. Sender and receiver</text><g transform="translate(20 48)"><path d="M125 30 L125 83.33333333333334" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M125 83.33333333333334 L125 136.66666666666669" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M125 136.66666666666669 L125 190" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M375 30 L375 83.33333333333334" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M375 83.33333333333334 L375 136.66666666666669" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M375 136.66666666666669 L375 190" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M125 190 L375 190" stroke="#6ee7b7" stroke-width="2"  fill="none"/><rect x="81.25" y="18" width="87.5" height="24" rx="5" fill="#0f172a" stroke="#a78bfa"/><text x="125" y="34" text-anchor="middle" font-size="11.5">Application</text><rect x="87.75" y="71.33333333333334" width="74.5" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="125" y="87.33333333333334" text-anchor="middle" font-size="11.5">Transport</text><rect x="91" y="124.66666666666669" width="68" height="24" rx="5" fill="#0f172a" stroke="#22d3ee"/><text x="125" y="140.66666666666669" text-anchor="middle" font-size="11.5">Internet</text><rect x="93" y="178" width="64" height="24" rx="5" fill="#0f172a" stroke="#34d399"/><text x="125" y="194" text-anchor="middle" font-size="11.5">Link</text><rect x="331.25" y="18" width="87.5" height="24" rx="5" fill="#0f172a" stroke="#a78bfa"/><text x="375" y="34" text-anchor="middle" font-size="11.5">Application</text><rect x="337.75" y="71.33333333333334" width="74.5" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="375" y="87.33333333333334" text-anchor="middle" font-size="11.5">Transport</text><rect x="341" y="124.66666666666669" width="68" height="24" rx="5" fill="#0f172a" stroke="#22d3ee"/><text x="375" y="140.66666666666669" text-anchor="middle" font-size="11.5">Internet</text><rect x="343" y="178" width="64" height="24" rx="5" fill="#0f172a" stroke="#34d399"/><text x="375" y="194" text-anchor="middle" font-size="11.5">Link</text></g><text x="18" y="269" font-size="13" fill="#cbd5e1">Encapsulation down the sender; decapsulation up the receiver.</text></g><g transform="translate(565 1063)"><rect width="540" height="312" rx="12" fill="#172235" stroke="#41536d"/><text x="18" y="29" font-size="19" font-weight="bold">8. Frame composition</text><g transform="translate(20 48)"><path d="M55 110 L152.5 110" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M152.5 110 L250 110" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 110 L347.5 110" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M347.5 110 L445 110" stroke="#6ee7b7" stroke-width="2"  fill="none"/><rect x="21" y="98" width="68" height="24" rx="5" fill="#0f172a" stroke="#a78bfa"/><text x="55" y="114" text-anchor="middle" font-size="11.5">Ethernet</text><rect x="120.5" y="98" width="64" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="152.5" y="114" text-anchor="middle" font-size="11.5">IPv4</text><rect x="218" y="98" width="64" height="24" rx="5" fill="#0f172a" stroke="#22d3ee"/><text x="250" y="114" text-anchor="middle" font-size="11.5">TCP</text><rect x="307" y="98" width="81" height="24" rx="5" fill="#0f172a" stroke="#34d399"/><text x="347.5" y="114" text-anchor="middle" font-size="11.5">100 B data</text><rect x="413" y="98" width="64" height="24" rx="5" fill="#0f172a" stroke="#a78bfa"/><text x="445" y="114" text-anchor="middle" font-size="11.5">FCS</text></g><text x="18" y="269" font-size="13" fill="#cbd5e1">Ethernet 14 B + IPv4 20 B + TCP 20 B + data + FCS 4 B.</text></g><g transform="translate(15 1389)"><rect width="540" height="312" rx="12" fill="#172235" stroke="#41536d"/><text x="18" y="29" font-size="19" font-weight="bold">9. Routed MAC vs IP</text><g transform="translate(20 48)"><path d="M55 110 L185 110" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M185 110 L315 110" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M315 110 L445 110" stroke="#6ee7b7" stroke-width="2"  fill="none"/><rect x="17.75" y="98" width="74.5" height="24" rx="5" fill="#0f172a" stroke="#a78bfa"/><text x="55" y="114" text-anchor="middle" font-size="11.5">Client IP</text><rect x="141.25" y="98" width="87.5" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="185" y="114" text-anchor="middle" font-size="11.5">Gateway MAC</text><rect x="283" y="98" width="64" height="24" rx="5" fill="#0f172a" stroke="#22d3ee"/><text x="315" y="114" text-anchor="middle" font-size="11.5">Router</text><rect x="407.75" y="98" width="74.5" height="24" rx="5" fill="#0f172a" stroke="#34d399"/><text x="445" y="114" text-anchor="middle" font-size="11.5">Server IP</text></g><text x="18" y="269" font-size="13" fill="#cbd5e1">Router rebuilds local frames; IP destination normally persists.</text></g><g transform="translate(565 1389)"><rect width="540" height="312" rx="12" fill="#172235" stroke="#41536d"/><text x="18" y="29" font-size="19" font-weight="bold">10. Wireshark packet tree</text><g transform="translate(20 48)"><path d="M250 40 L250 77.5" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 77.5 L250 115" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 115 L250 152.5" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 152.5 L250 190" stroke="#6ee7b7" stroke-width="2"  fill="none"/><rect x="196.5" y="28" width="107" height="24" rx="5" fill="#0f172a" stroke="#a78bfa"/><text x="250" y="44" text-anchor="middle" font-size="11.5">Frame metadata</text><rect x="206.25" y="65.5" width="87.5" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="250" y="81.5" text-anchor="middle" font-size="11.5">Ethernet II</text><rect x="218" y="103" width="64" height="24" rx="5" fill="#0f172a" stroke="#22d3ee"/><text x="250" y="119" text-anchor="middle" font-size="11.5">IPv4</text><rect x="218" y="140.5" width="64" height="24" rx="5" fill="#0f172a" stroke="#34d399"/><text x="250" y="156.5" text-anchor="middle" font-size="11.5">TCP</text><rect x="186.75" y="178" width="126.5" height="24" rx="5" fill="#0f172a" stroke="#a78bfa"/><text x="250" y="194" text-anchor="middle" font-size="11.5">HTTP if plaintext</text></g><text x="18" y="269" font-size="13" fill="#cbd5e1">Illustrative protocol view; HTTPS payload normally encrypted.</text></g></g></svg>