<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1404" viewBox="0 0 1120 1404" role="img"><title>06-The-OSI-Model — visual atlas</title><rect width="1120" height="1404" rx="14" fill="#0f172a"/><g font-family="Arial,sans-serif" fill="#f8fafc"><text x="28" y="39" font-size="25" font-weight="bold">06 The OSI Model</text><text x="28" y="65" font-size="15" fill="#a5b4c9">Original educational diagrams • static reference • conceptual examples</text><g transform="translate(15 85)"><rect width="540" height="312" rx="12" fill="#172235" stroke="#41536d"/><text x="18" y="29" font-size="19" font-weight="bold">1. Interoperability</text><g transform="translate(20 48)"><path d="M250 115 L250 38" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 115 L425 115" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 115 L250 192" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 115 L75 115.00000000000001" stroke="#6ee7b7" stroke-width="2"  fill="none"/><rect x="190" y="103" width="120" height="24" rx="5" fill="#0f172a" stroke="#a78bfa"/><text x="250" y="119" text-anchor="middle" font-size="11.5">Common protocols</text><rect x="218" y="26" width="64" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="250" y="42" text-anchor="middle" font-size="11.5">Windows</text><rect x="393" y="103" width="64" height="24" rx="5" fill="#0f172a" stroke="#22d3ee"/><text x="425" y="119" text-anchor="middle" font-size="11.5">Linux</text><rect x="218" y="180" width="64" height="24" rx="5" fill="#0f172a" stroke="#34d399"/><text x="250" y="196" text-anchor="middle" font-size="11.5">Android</text><rect x="43" y="103.00000000000001" width="64" height="24" rx="5" fill="#0f172a" stroke="#a78bfa"/><text x="75" y="119.00000000000001" text-anchor="middle" font-size="11.5">macOS</text></g><text x="18" y="269" font-size="13" fill="#cbd5e1">Compatible protocol implementations enable different operating systems.</text></g><g transform="translate(565 85)"><rect width="540" height="312" rx="12" fill="#172235" stroke="#41536d"/><text x="18" y="29" font-size="19" font-weight="bold">2. Application and transport orientation</text><g transform="translate(20 48)"><path d="M250 40 L250 65" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 65 L250 90" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 90 L250 115" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 115 L250 140" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 140 L250 165" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 165 L250 190" stroke="#6ee7b7" stroke-width="2"  fill="none"/><rect x="199.75" y="28" width="100.5" height="24" rx="5" fill="#0f172a" stroke="#a78bfa"/><text x="250" y="44" text-anchor="middle" font-size="11.5">7 Application</text><rect x="196.5" y="53" width="107" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="250" y="69" text-anchor="middle" font-size="11.5">6 Presentation</text><rect x="212.75" y="78" width="74.5" height="24" rx="5" fill="#0f172a" stroke="#22d3ee"/><text x="250" y="94" text-anchor="middle" font-size="11.5">5 Session</text><rect x="206.25" y="103" width="87.5" height="24" rx="5" fill="#0f172a" stroke="#34d399"/><text x="250" y="119" text-anchor="middle" font-size="11.5">4 Transport</text><rect x="212.75" y="128" width="74.5" height="24" rx="5" fill="#0f172a" stroke="#a78bfa"/><text x="250" y="144" text-anchor="middle" font-size="11.5">3 Network</text><rect x="206.25" y="153" width="87.5" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="250" y="169" text-anchor="middle" font-size="11.5">2 Data Link</text><rect x="209.5" y="178" width="81" height="24" rx="5" fill="#0f172a" stroke="#22d3ee"/><text x="250" y="194" text-anchor="middle" font-size="11.5">1 Physical</text></g><text x="18" y="269" font-size="13" fill="#cbd5e1">Layers 7–5 application; 4–2 transport; 1 physical.</text></g><g transform="translate(15 411)"><rect width="540" height="312" rx="12" fill="#172235" stroke="#41536d"/><text x="18" y="29" font-size="19" font-weight="bold">3. Layer service dependencies</text><g transform="translate(20 48)"><path d="M250 40 L250 65" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 65 L250 90" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 90 L250 115" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 115 L250 140" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 140 L250 165" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 165 L250 190" stroke="#6ee7b7" stroke-width="2"  fill="none"/><rect x="206.25" y="28" width="87.5" height="24" rx="5" fill="#0f172a" stroke="#a78bfa"/><text x="250" y="44" text-anchor="middle" font-size="11.5">Application</text><rect x="203" y="53" width="94" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="250" y="69" text-anchor="middle" font-size="11.5">Presentation</text><rect x="218" y="78" width="64" height="24" rx="5" fill="#0f172a" stroke="#22d3ee"/><text x="250" y="94" text-anchor="middle" font-size="11.5">Session</text><rect x="212.75" y="103" width="74.5" height="24" rx="5" fill="#0f172a" stroke="#34d399"/><text x="250" y="119" text-anchor="middle" font-size="11.5">Transport</text><rect x="218" y="128" width="64" height="24" rx="5" fill="#0f172a" stroke="#a78bfa"/><text x="250" y="144" text-anchor="middle" font-size="11.5">Network</text><rect x="212.75" y="153" width="74.5" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="250" y="169" text-anchor="middle" font-size="11.5">Data Link</text><rect x="216" y="178" width="68" height="24" rx="5" fill="#0f172a" stroke="#22d3ee"/><text x="250" y="194" text-anchor="middle" font-size="11.5">Physical</text></g><text x="18" y="269" font-size="13" fill="#cbd5e1">Each layer uses lower services and offers upper services.</text></g><g transform="translate(565 411)"><rect width="540" height="312" rx="12" fill="#172235" stroke="#41536d"/><text x="18" y="29" font-size="19" font-weight="bold">4. Peer communication</text><g transform="translate(20 48)"><path d="M125 30 L125 56.66666666666667" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M125 56.66666666666667 L125 83.33333333333334" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M125 83.33333333333334 L125 110" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M125 110 L125 136.66666666666669" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M125 136.66666666666669 L125 163.33333333333334" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M125 163.33333333333334 L125 190" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M375 30 L375 56.66666666666667" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M375 56.66666666666667 L375 83.33333333333334" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M375 83.33333333333334 L375 110" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M375 110 L375 136.66666666666669" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M375 136.66666666666669 L375 163.33333333333334" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M375 163.33333333333334 L375 190" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M125 190 L375 190" stroke="#6ee7b7" stroke-width="2"  fill="none"/><rect x="74.75" y="18" width="100.5" height="24" rx="5" fill="#0f172a" stroke="#a78bfa"/><text x="125" y="34" text-anchor="middle" font-size="11.5">7 Application</text><rect x="71.5" y="44.66666666666667" width="107" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="125" y="60.66666666666667" text-anchor="middle" font-size="11.5">6 Presentation</text><rect x="87.75" y="71.33333333333334" width="74.5" height="24" rx="5" fill="#0f172a" stroke="#22d3ee"/><text x="125" y="87.33333333333334" text-anchor="middle" font-size="11.5">5 Session</text><rect x="81.25" y="98" width="87.5" height="24" rx="5" fill="#0f172a" stroke="#34d399"/><text x="125" y="114" text-anchor="middle" font-size="11.5">4 Transport</text><rect x="87.75" y="124.66666666666669" width="74.5" height="24" rx="5" fill="#0f172a" stroke="#a78bfa"/><text x="125" y="140.66666666666669" text-anchor="middle" font-size="11.5">3 Network</text><rect x="81.25" y="151.33333333333334" width="87.5" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="125" y="167.33333333333334" text-anchor="middle" font-size="11.5">2 Data Link</text><rect x="84.5" y="178" width="81" height="24" rx="5" fill="#0f172a" stroke="#22d3ee"/><text x="125" y="194" text-anchor="middle" font-size="11.5">1 Physical</text><rect x="324.75" y="18" width="100.5" height="24" rx="5" fill="#0f172a" stroke="#34d399"/><text x="375" y="34" text-anchor="middle" font-size="11.5">7 Application</text><rect x="321.5" y="44.66666666666667" width="107" height="24" rx="5" fill="#0f172a" stroke="#a78bfa"/><text x="375" y="60.66666666666667" text-anchor="middle" font-size="11.5">6 Presentation</text><rect x="337.75" y="71.33333333333334" width="74.5" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="375" y="87.33333333333334" text-anchor="middle" font-size="11.5">5 Session</text><rect x="331.25" y="98" width="87.5" height="24" rx="5" fill="#0f172a" stroke="#22d3ee"/><text x="375" y="114" text-anchor="middle" font-size="11.5">4 Transport</text><rect x="337.75" y="124.66666666666669" width="74.5" height="24" rx="5" fill="#0f172a" stroke="#34d399"/><text x="375" y="140.66666666666669" text-anchor="middle" font-size="11.5">3 Network</text><rect x="331.25" y="151.33333333333334" width="87.5" height="24" rx="5" fill="#0f172a" stroke="#a78bfa"/><text x="375" y="167.33333333333334" text-anchor="middle" font-size="11.5">2 Data Link</text><rect x="334.5" y="178" width="81" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="375" y="194" text-anchor="middle" font-size="11.5">1 Physical</text></g><text x="18" y="269" font-size="13" fill="#cbd5e1">Peer protocols are logical; physical path carries actual information.</text></g><g transform="translate(15 737)"><rect width="540" height="312" rx="12" fill="#172235" stroke="#41536d"/><text x="18" y="29" font-size="19" font-weight="bold">5. Network device classification</text><g transform="translate(20 48)"><path d="M250 40 L250 90" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 90 L250 140" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 140 L250 190" stroke="#6ee7b7" stroke-width="2"  fill="none"/><rect x="180.25" y="23" width="139.5" height="34" rx="5" fill="#0f172a" stroke="#a78bfa"/><text x="250" y="37.5" text-anchor="middle" font-size="11.5">Application proxy /</text><text x="250" y="50.5" text-anchor="middle" font-size="11.5">capable firewall</text><rect x="206.25" y="78" width="87.5" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="250" y="94" text-anchor="middle" font-size="11.5">Router - IP</text><rect x="164" y="128" width="172" height="24" rx="5" fill="#0f172a" stroke="#22d3ee"/><text x="250" y="144" text-anchor="middle" font-size="11.5">Switch / bridge - frames</text><rect x="164" y="178" width="172" height="24" rx="5" fill="#0f172a" stroke="#34d399"/><text x="250" y="194" text-anchor="middle" font-size="11.5">Repeater / hub - signals</text></g><text x="18" y="269" font-size="13" fill="#cbd5e1">Layer responsibilities, not a mandatory connection chain.</text></g><g transform="translate(565 737)"><rect width="540" height="312" rx="12" fill="#172235" stroke="#41536d"/><text x="18" y="29" font-size="19" font-weight="bold">6. JSON representation</text><g transform="translate(20 48)"><path d="M55 110 L185 110" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M185 110 L315 110" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M315 110 L445 110" stroke="#6ee7b7" stroke-width="2"  fill="none"/><rect x="4.75" y="98" width="100.5" height="24" rx="5" fill="#0f172a" stroke="#a78bfa"/><text x="55" y="114" text-anchor="middle" font-size="11.5">Python object</text><rect x="147.75" y="98" width="74.5" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="185" y="114" text-anchor="middle" font-size="11.5">JSON text</text><rect x="271.25" y="98" width="87.5" height="24" rx="5" fill="#0f172a" stroke="#22d3ee"/><text x="315" y="114" text-anchor="middle" font-size="11.5">UTF-8 bytes</text><rect x="413" y="98" width="64" height="24" rx="5" fill="#0f172a" stroke="#34d399"/><text x="445" y="114" text-anchor="middle" font-size="11.5">Parser</text></g><text x="18" y="269" font-size="13" fill="#cbd5e1">Python serialization converts structured data to UTF-8 bytes.</text></g><g transform="translate(15 1063)"><rect width="540" height="312" rx="12" fill="#172235" stroke="#41536d"/><text x="18" y="29" font-size="19" font-weight="bold">7. Layered troubleshooting</text><g transform="translate(20 48)"><path d="M250 40 L250 70" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 70 L250 100" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 100 L250 130" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 130 L250 160" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 160 L250 190" stroke="#6ee7b7" stroke-width="2"  fill="none"/><rect x="199.75" y="28" width="100.5" height="24" rx="5" fill="#0f172a" stroke="#a78bfa"/><text x="250" y="44" text-anchor="middle" font-size="11.5">Physical link</text><rect x="193.25" y="58" width="113.5" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="250" y="74" text-anchor="middle" font-size="11.5">VLAN / neighbor</text><rect x="216" y="88" width="68" height="24" rx="5" fill="#0f172a" stroke="#22d3ee"/><text x="250" y="104" text-anchor="middle" font-size="11.5">IP route</text><rect x="183.5" y="118" width="133" height="24" rx="5" fill="#0f172a" stroke="#34d399"/><text x="250" y="134" text-anchor="middle" font-size="11.5">Transport listener</text><rect x="199.75" y="148" width="100.5" height="24" rx="5" fill="#0f172a" stroke="#a78bfa"/><text x="250" y="164" text-anchor="middle" font-size="11.5">TLS / session</text><rect x="183.5" y="178" width="133" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="250" y="194" text-anchor="middle" font-size="11.5">Application policy</text></g><text x="18" y="269" font-size="13" fill="#cbd5e1">Investigate evidence at relevant boundaries, not blindly in order.</text></g><g transform="translate(565 1063)"><rect width="540" height="312" rx="12" fill="#172235" stroke="#41536d"/><text x="18" y="29" font-size="19" font-weight="bold">8. UniTrack scanner architecture</text><g transform="translate(20 48)"><path d="M250 40 L250 70" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 70 L250 100" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 100 L250 130" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 130 L250 160" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 160 L250 190" stroke="#6ee7b7" stroke-width="2"  fill="none"/><rect x="209.5" y="28" width="81" height="24" rx="5" fill="#0f172a" stroke="#a78bfa"/><text x="250" y="44" text-anchor="middle" font-size="11.5">QR scanner</text><rect x="170.5" y="58" width="159" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="250" y="74" text-anchor="middle" font-size="11.5">Network infrastructure</text><rect x="206.25" y="88" width="87.5" height="24" rx="5" fill="#0f172a" stroke="#22d3ee"/><text x="250" y="104" text-anchor="middle" font-size="11.5">TCP and TLS</text><rect x="203" y="118" width="94" height="24" rx="5" fill="#0f172a" stroke="#34d399"/><text x="250" y="134" text-anchor="middle" font-size="11.5">UniTrack API</text><rect x="199.75" y="148" width="100.5" height="24" rx="5" fill="#0f172a" stroke="#a78bfa"/><text x="250" y="164" text-anchor="middle" font-size="11.5">QR validation</text><rect x="190" y="178" width="120" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="250" y="194" text-anchor="middle" font-size="11.5">Private database</text></g><text x="18" y="269" font-size="13" fill="#cbd5e1">Link and transport are necessary, but authorization remains essential.</text></g></g></svg>