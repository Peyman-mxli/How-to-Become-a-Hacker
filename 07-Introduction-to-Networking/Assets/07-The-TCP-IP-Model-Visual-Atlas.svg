"173" width="100.5" height="24" rx="5" fill="#0f172a" stroke="#a78bfa"/><text x="425" y="189" text-anchor="middle" font-size="11.5">Selected .1.3</text></g><text x="18" y="269" font-size="13" fill="#cbd5e1">Choose most-specific applicable prefix; default is fallback.</text></g><g transform="translate(565 737)"><rect width="540" height="312" rx="12" fill="#172235" stroke="#41536d"/><text x="18" y="29" font-size="19" font-weight="bold">6. TCP retransmission</text><g transform="translate(20 48)"><path d="M75 25 L250 85" stroke="#f87171" stroke-width="2" stroke-dasharray="5 4" fill="none"/><path d="M75 25 L250 135" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 135 L425 25" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M425 25 L250 190" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 190 L75 25" stroke="#6ee7b7" stroke-width="2"  fill="none"/><rect x="43" y="13" width="64" height="24" rx="5" fill="#0f172a" stroke="#a78bfa"/><text x="75" y="29" text-anchor="middle" font-size="11.5">Sender</text><rect x="391" y="13" width="68" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="425" y="29" text-anchor="middle" font-size="11.5">Receiver</text><rect x="203" y="73" width="94" height="24" rx="5" fill="#0f172a" stroke="#22d3ee"/><text x="250" y="89" text-anchor="middle" font-size="11.5">SEQ 201 lost</text><rect x="196.5" y="123" width="107" height="24" rx="5" fill="#0f172a" stroke="#34d399"/><text x="250" y="139" text-anchor="middle" font-size="11.5">Retransmit 201</text><rect x="218" y="178" width="64" height="24" rx="5" fill="#0f172a" stroke="#a78bfa"/><text x="250" y="194" text-anchor="middle" font-size="11.5">ACK 301</text></g><text x="18" y="269" font-size="13" fill="#cbd5e1">100 bytes from seq 201 lost, retransmitted, then ACK 301.</text></g><g transform="translate(15 1063)"><rect width="540" height="312" rx="12" fill="#172235" stroke="#41536d"/><text x="18" y="29" font-size="19" font-weight="bold">7. Flow versus congestion control</text><g transform="translate(20 48)"><path d="M55 110 L250 110" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 110 L445 110" stroke="#6ee7b7" stroke-width="2"  fill="none"/><rect x="17.75" y="98" width="74.5" height="24" rx="5" fill="#0f172a" stroke="#a78bfa"/><text x="55" y="114" text-anchor="middle" font-size="11.5">rwnd = 16</text><rect x="216" y="98" width="68" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="250" y="114" text-anchor="middle" font-size="11.5">cwnd = 8</text><rect x="401.25" y="98" width="87.5" height="24" rx="5" fill="#0f172a" stroke="#22d3ee"/><text x="445" y="114" text-anchor="middle" font-size="11.5">min = 8 KiB</text></g><text x="18" y="269" font-size="13" fill="#cbd5e1">rwnd 16 KiB, cwnd 8 KiB; effective window limit 8 KiB.</text></g><g transform="translate(565 1063)"><rect width="540" height="312" rx="12" fill="#172235" stroke="#41536d"/><text x="18" y="29" font-size="19" font-weight="bold">8. Port multiplexing</text><g transform="translate(20 48)"><path d="M100 50 L390 110" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M100 170 L390 110" stroke="#6ee7b7" stroke-width="2"  fill="none"/><rect x="43.25" y="38" width="113.5" height="24" rx="5" fill="#0f172a" stroke="#a78bfa"/><text x="100" y="54" text-anchor="middle" font-size="11.5">Client A :51514</text><rect x="43.25" y="158" width="113.5" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="100" y="174" text-anchor="middle" font-size="11.5">Client B :51515</text><rect x="326.75" y="98" width="126.5" height="24" rx="5" fill="#0f172a" stroke="#22d3ee"/><text x="390" y="114" text-anchor="middle" font-size="11.5">HTTPS server :443</text></g><text x="18" y="269" font-size="13" fill="#cbd5e1">Distinct source endpoints share destination TCP port 443.</text></g><g transform="translate(15 1389)"><rect width="540" height="312" rx="12" fill="#172235" stroke="#41536d"/><text x="18" y="29" font-size="19" font-weight="bold">9. URL decomposition</text><g transform="translate(20 48)"><path d="M55 110 L250 110" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 110 L445 110" stroke="#6ee7b7" stroke-width="2"  fill="none"/><rect x="21" y="98" width="68" height="24" rx="5" fill="#0f172a" stroke="#a78bfa"/><text x="55" y="114" text-anchor="middle" font-size="11.5">https://</text><rect x="183.5" y="98" width="133" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="250" y="114" text-anchor="middle" font-size="11.5">portal.example.com</text><rect x="407.75" y="98" width="74.5" height="24" rx="5" fill="#0f172a" stroke="#22d3ee"/><text x="445" y="114" text-anchor="middle" font-size="11.5">/students</text></g><text x="18" y="269" font-size="13" fill="#cbd5e1">FQDN is portal.example.com; path is not part of DNS name.</text></g><g transform="translate(565 1389)"><rect width="540" height="312" rx="12" fill="#172235" stroke="#41536d"/><text x="18" y="29" font-size="19" font-weight="bold">10. DNS cache-miss resolution</text><g transform="translate(20 48)"><path d="M80 30 L350 30" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M350 30 L100 110" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M350 30 L250 110" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M350 30 L400 110" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M400 110 L350 195" stroke="#6ee7b7" stroke-width="2"  fill="none"/><rect x="29.75" y="18" width="100.5" height="24" rx="5" fill="#0f172a" stroke="#a78bfa"/><text x="80" y="34" text-anchor="middle" font-size="11.5">Stub resolver</text><rect x="283.5" y="18" width="133" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="350" y="34" text-anchor="middle" font-size="11.5">Recursive resolver</text><rect x="68" y="98" width="64" height="24" rx="5" fill="#0f172a" stroke="#22d3ee"/><text x="100" y="114" text-anchor="middle" font-size="11.5">Root</text><rect x="218" y="98" width="64" height="24" rx="5" fill="#0f172a" stroke="#34d399"/><text x="250" y="114" text-anchor="middle" font-size="11.5">TLD</text><rect x="349.75" y="98" width="100.5" height="24" rx="5" fill="#0f172a" stroke="#a78bfa"/><text x="400" y="114" text-anchor="middle" font-size="11.5">Authoritative</text><rect x="299.75" y="183" width="100.5" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="350" y="199" text-anchor="middle" font-size="11.5">A: 192.0.2.25</text></g><text x="18" y="269" font-size="13" fill="#cbd5e1">Recursive resolver follows referrals and returns record.</text></g><g transform="translate(15 1715)"><rect width="540" height="312" rx="12" fill="#172235" stroke="#41536d"/><text x="18" y="29" font-size="19" font-weight="bold">11. UniTrack TCP/IP architecture</text><g transform="translate(20 48)"><path d="M250 40 L250 90" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 90 L250 140" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 140 L250 190" stroke="#6ee7b7" stroke-width="2"  fill="none"/><rect x="170.5" y="23" width="159" height="34" rx="5" fill="#0f172a" stroke="#a78bfa"/><text x="250" y="37.5" text-anchor="middle" font-size="11.5">Browser / QR scanner -</text><text x="250" y="50.5" text-anchor="middle" font-size="11.5">HTTP(S)</text><rect x="167.25" y="73" width="165.5" height="34" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="250" y="87.5" text-anchor="middle" font-size="11.5">Application endpoints -</text><text x="250" y="100.5" text-anchor="middle" font-size="11.5">TCP/UDP</text><rect x="186.75" y="123" width="126.5" height="34" rx="5" fill="#0f172a" stroke="#22d3ee"/><text x="250" y="137.5" text-anchor="middle" font-size="11.5">IP addressing and</text><text x="250" y="150.5" text-anchor="middle" font-size="11.5">routing</text><rect x="190" y="178" width="120" height="24" rx="5" fill="#0f172a" stroke="#34d399"/><text x="250" y="194" text-anchor="middle" font-size="11.5">Ethernet / Wi-Fi</text></g><text x="18" y="269" font-size="13" fill="#cbd5e1">Conceptual communication stack, not verified deployment.</text></g></g></svg>