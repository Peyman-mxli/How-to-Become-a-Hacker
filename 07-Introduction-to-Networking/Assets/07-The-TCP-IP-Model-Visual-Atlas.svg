<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="2056" viewBox="0 0 1120 2056" role="img"><title>07-The-TCP-IP-Model — visual atlas</title><rect width="1120" height="2056" rx="14" fill="#0f172a"/><g font-family="Arial,sans-serif" fill="#f8fafc"><text x="28" y="39" font-size="25" font-weight="bold">07 The TCP IP Model</text><text x="28" y="65" font-size="15" fill="#a5b4c9">Original educational diagrams • static reference • conceptual examples</text><g transform="translate(15 85)"><rect width="540" height="312" rx="12" fill="#172235" stroke="#41536d"/><text x="18" y="29" font-size="19" font-weight="bold">1. TCP/IP interoperability</text><g transform="translate(20 48)"><path d="M250 115 L250 38" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 115 L425 115" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 115 L250 192" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 115 L75 115.00000000000001" stroke="#6ee7b7" stroke-width="2"  fill="none"/><rect x="218" y="103" width="64" height="24" rx="5" fill="#0f172a" stroke="#a78bfa"/><text x="250" y="119" text-anchor="middle" font-size="11.5">TCP/IP</text><rect x="218" y="26" width="64" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="250" y="42" text-anchor="middle" font-size="11.5">Windows</text><rect x="393" y="103" width="64" height="24" rx="5" fill="#0f172a" stroke="#22d3ee"/><text x="425" y="119" text-anchor="middle" font-size="11.5">Linux</text><rect x="218" y="180" width="64" height="24" rx="5" fill="#0f172a" stroke="#34d399"/><text x="250" y="196" text-anchor="middle" font-size="11.5">Android</text><rect x="43" y="103.00000000000001" width="64" height="24" rx="5" fill="#0f172a" stroke="#a78bfa"/><text x="75" y="119.00000000000001" text-anchor="middle" font-size="11.5">macOS</text></g><text x="18" y="269" font-size="13" fill="#cbd5e1">Common protocols enable different platforms to communicate.</text></g><g transform="translate(565 85)"><rect width="540" height="312" rx="12" fill="#172235" stroke="#41536d"/><text x="18" y="29" font-size="19" font-weight="bold">2. Four TCP/IP layers</text><g transform="translate(20 48)"><path d="M250 40 L250 90" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 90 L250 140" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M250 140 L250 190" stroke="#6ee7b7" stroke-width="2"  fill="none"/><rect x="199.75" y="28" width="100.5" height="24" rx="5" fill="#0f172a" stroke="#a78bfa"/><text x="250" y="44" text-anchor="middle" font-size="11.5">4 Application</text><rect x="206.25" y="78" width="87.5" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="250" y="94" text-anchor="middle" font-size="11.5">3 Transport</text><rect x="209.5" y="128" width="81" height="24" rx="5" fill="#0f172a" stroke="#22d3ee"/><text x="250" y="144" text-anchor="middle" font-size="11.5">2 Internet</text><rect x="218" y="178" width="64" height="24" rx="5" fill="#0f172a" stroke="#34d399"/><text x="250" y="194" text-anchor="middle" font-size="11.5">1 Link</text></g><text x="18" y="269" font-size="13" fill="#cbd5e1">Application, Transport, Internet, Link.</text></g><g transform="translate(15 411)"><rect width="540" height="312" rx="12" fill="#172235" stroke="#41536d"/><text x="18" y="29" font-size="19" font-weight="bold">3. OSI / TCP-IP mapping</text><g transform="translate(20 48)"><path d="M120 20 L380 51" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M120 51 L380 51" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M120 82 L380 51" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M120 113 L380 113" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M120 144 L380 144" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M120 175 L380 190" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M120 206 L380 190" stroke="#6ee7b7" stroke-width="2"  fill="none"/><rect x="69.75" y="8" width="100.5" height="24" rx="5" fill="#0f172a" stroke="#a78bfa"/><text x="120" 