<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Layer 3 interactive companion</title><style>body{font:16px/1.5 system-ui,sans-serif;background:#0f172a;color:#f8fafc;max-width:900px;margin:auto;padding:24px}section{background:#172235;border:1px solid #475569;border-radius:12px;margin:20px 0;padding:20px}button,input,select{font:inherit;padding:7px}button{cursor:pointer}svg{width:100%;height:auto}output{display:block;background:#0d1726;padding:12px;white-space:pre-wrap;border-radius:6px}label{display:block;margin:8px 0}h2{font-size:20px}</style></head><body><h1>08 — Network Layer</h1><p>Offline conceptual simulations. No network traffic or external dependencies.</p><section><h2>Packet forwarding and TTL / Hop Limit</h2><label>Initial TTL: <input id="ttl" type="number" min="1" max="255" value="64"></label><button id="reset">Reset</button> <button id="next">Next hop</button><div id="graph"></div><output id="out"></output></section><section><h2>RIP vs OSPF routing metric</h2><label>Protocol <select id="protocol"><option>RIP</option><option>OSPF</option></select></label><div id="paths"></div><output id="result"></output><p>Illustrative graph only. Actual route policy and destination interface cost may also matter.</p></section><script>"use strict";const $=s=>document.getElementById(s);let step=0;const labels=["Client","Router A","Router B","Server"];function initial(){return Math.min(255,Math.max(1,Math.floor(Number($("ttl").value)||1)))}function show(){let t=initial(),expired=step>0&&step<=2&&t<=step,remaining=Math.max(0,t-Math.min(step,2));let s='<svg viewBox="0 0 600 120" aria-label="Packet path"><path d="M75 60H525" stroke="#64748b" stroke-width="3"/>';labels.forEach((l,i)=>{let x=75+i*150;s+='<rect x="'+(x-55)+'" y="37" width="110" height="46" rx="7" fill="'+(i===step?(expired?'#991b1b':'#0891b2'):'#1e293b')+'" stroke="#93c5fd"/><text x="'+x+'" y="65" fill="white" text-anchor="middle" font-size="14">'+l+'</text>'});$("graph").innerHTML=s+'</svg>';$("out").textContent=labels[step]+" — TTL "+remaining+"\n"+(expired?"Packet discarded; ICMP Time Exceeded normally generated if applicable.":step===3?"Destination receives packet. No forwarding decrement at destination.":step===0?"Packet prepared at source.":"Router selected next hop and decremented TTL.");$("next").disabled=expired||step===3}$("next").onclick=()=>{step++;show()};$("reset").onclick=()=>{step=0;show()};$("ttl").oninput=()=>{step=0;show()};show();function paths(){let ospf=$("protocol").value==="OSPF",a=ospf?"#64748b":"#34d399",b=ospf?"#34d399":"#64748b";$("paths").innerHTML='<svg viewBox="0 0 600 230"><path d="M60 115L300 35 540 115" stroke="'+a+'" stroke-width="4" fill="none"/><path d="M60 115L200 195 400 195 540 115" stroke="'+b+'" stroke-width="4" fill="none"/>'+[[60,115,"A"],[300,35,"B"],[540,115,"D"],[200,195,"C"],[400,195,"E"]].map(([x,y,l])=>'<circle cx="'+x+'" cy="'+y+'" r="19" fill="#2563eb"/><text x="'+x+'" y="'+(y+5)+'" text-anchor="middle" fill="white">'+l+'</text>').join("")+'<g fill="white" font-size="13"><text x="170" y="62">10</text><text x="420" y="62">10</text><text x="120" y="165">5</text><text x="300" y="185">5</text><text x="470" y="165">5</text></g></svg>';$("result").textContent=ospf?"OSPF: A-C-E-D; cost 5+5+5=15, compared with cost 20.":"RIP: A-B-D; 2 links rather than 3 in the illustrative graph."}$("protocol").onchange=paths;paths();</script></body></html>
