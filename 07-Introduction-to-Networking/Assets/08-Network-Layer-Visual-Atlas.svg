<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1740" viewBox="0 0 1120 1740" role="img"><title>Section 08 Network Layer visual atlas</title><desc>Ten original diagrams for Layer 3, routing, TTL, IPv4 and IPv6, IPsec, ICMP, IGMP, RIP and OSPF, and UniTrack.</desc><rect width="1120" height="1740" rx="12" fill="#0f172a"/><g font-family="Arial,sans-serif" fill="#f8fafc"><text x="25" y="38" font-size="26" font-weight="bold">08 — Network Layer</text><text x="25" y="63" font-size="15" fill="#cbd5e1">Original educational visual atlas — conceptual examples</text><g transform="translate(15 85)"><rect width="540" height="312" rx="12" fill="#172235" stroke="#41536d"/><text x="18" y="29" font-size="19" font-weight="bold">1. Layer 3 in OSI</text><g transform="translate(20 48)"><path d="M250 15 L250 45" fill="none" stroke="#6ee7b7" stroke-width="2" /><path d="M250 45 L250 75" fill="none" stroke="#6ee7b7" stroke-width="2" /><path d="M250 75 L250 105" fill="none" stroke="#6ee7b7" stroke-width="2" /><path d="M250 105 L250 135" fill="none" stroke="#6ee7b7" stroke-width="2" /><path d="M250 135 L250 165" fill="none" stroke="#6ee7b7" stroke-width="2" /><path d="M250 165 L250 195" fill="none" stroke="#6ee7b7" stroke-width="2" /><rect x="201.25" y="3" width="97.5" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="250" y="19" font-size="11.5" text-anchor="middle">7 Application</text><rect x="198" y="33" width="104" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="250" y="49" font-size="11.5" text-anchor="middle">6 Presentation</text><rect x="214.25" y="63" width="71.5" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="250" y="79" font-size="11.5" text-anchor="middle">5 Session</text><rect x="207.75" y="93" width="84.5" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="250" y="109" font-size="11.5" text-anchor="middle">4 Transport</text><rect x="214.25" y="123" width="71.5" height="24" rx="5" fill="#0891b2" stroke="#60a5fa"/><text x="250" y="139" font-size="11.5" text-anchor="middle">3 NETWORK</text><rect x="207.75" y="153" width="84.5" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="250" y="169" font-size="11.5" text-anchor="middle">2 Data Link</text><rect x="211" y="183" width="78" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="250" y="199" font-size="11.5" text-anchor="middle">1 Physical</text></g><text x="18" y="270" font-size="13" fill="#cbd5e1">Logical addressing and routing; other layers provide their own services.</text></g><g transform="translate(565 85)"><rect width="540" height="312" rx="12" fill="#172235" stroke="#41536d"/><text x="18" y="29" font-size="19" font-weight="bold">2. Inter-subnet forwarding</text><g transform="translate(20 48)"><path d="M75 60 L250 110" fill="none" stroke="#6ee7b7" stroke-width="2" /><path d="M250 110 L425 60" fill="none" stroke="#6ee7b7" stroke-width="2" /><rect x="26.25" y="48" width="97.5" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="75" y="64" font-size="11.5" text-anchor="middle">Client .10.50</text><rect x="198" y="93.5" width="104" height="33" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="250" y="107.5" font-size="11.5" text-anchor="middle">Router .10.1 /</text><text x="250" y="120.5" font-size="11.5" text-anchor="middle">.20.1</text><rect x="373" y="48" width="104" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="425" y="64" font-size="11.5" text-anchor="middle">Server .20.100</text></g><text x="18" y="270" font-size="13" fill="#cbd5e1">192.168.10.0/24 to 192.168.20.0/24; both routing and policy matter.</text></g><g transform="translate(15 411)"><rect width="540" height="312" rx="12" fill="#172235" stroke="#41536d"/><text x="18" y="29" font-size="19" font-weight="bold">3. Packet forwarding and TTL</text><g transform="translate(20 48)"><path d="M65 115 L185 115" fill="none" stroke="#6ee7b7" stroke-width="2" /><path d="M185 115 L315 115" fill="none" stroke="#6ee7b7" stroke-width="2" /><path d="M315 115 L435 115" fill="none" stroke="#6ee7b7" stroke-width="2" /><rect x="16.25" y="103" width="97.5" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="65" y="119" font-size="11.5" text-anchor="middle">Client TTL 64</text><rect x="129.75" y="103" width="110.5" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="185" y="119" font-size="11.5" text-anchor="middle">Router A TTL 63</text><rect x="259.75" y="103" width="110.5" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="315" y="119" font-size="11.5" text-anchor="middle">Router B TTL 62</text><rect x="386.25" y="103" width="97.5" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="435" y="119" font-size="11.5" text-anchor="middle">Server TTL 62</text></g><text x="18" y="270" font-size="13" fill="#cbd5e1">IP destination remains; local framing changes. Server receives TTL 62.</text></g><g transform="translate(565 411)"><rect width="540" height="312" rx="12" fill="#172235" stroke="#41536d"/><text x="18" y="29" font-size="19" font-weight="bold">4. Longest-prefix match</text><g transform="translate(20 48)"><path d="M250 30 L120 110" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/><path d="M250 30 L380 110" fill="none" stroke="#6ee7b7" stroke-width="2" /><path d="M380 110 L380 185" fill="none" stroke="#6ee7b7" stroke-width="2" /><rect x="207.75" y="18" width="84.5" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="250" y="34" font-size="11.5" text-anchor="middle">10.20.30.50</text><rect x="74.5" y="98" width="91" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="120" y="114" font-size="11.5" text-anchor="middle">10.20.0.0/16</text><rect x="331.25" y="98" width="97.5" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="380" y="114" font-size="11.5" text-anchor="middle">10.20.30.0/24</text><rect x="344.25" y="173" width="71.5" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="380" y="189" font-size="11.5" text-anchor="middle">Via .10.3</text></g><text x="18" y="270" font-size="13" fill="#cbd5e1">10.20.30.50 matches /16 and /24; most specific /24 wins.</text></g><g transform="translate(15 737)"><rect width="540" height="312" rx="12" fill="#172235" stroke="#41536d"/><text x="18" y="29" font-size="19" font-weight="bold">5. IPv4 and IPv6 headers</text><g transform="translate(20 48)"><path d="M120 60 L380 60" fill="none" stroke="#6ee7b7" stroke-width="2" /><path d="M85 155 L250 155" fill="none" stroke="#6ee7b7" stroke-width="2" /><path d="M250 155 L415 155" fill="none" stroke="#6ee7b7" stroke-width="2" /><rect x="77.75" y="48" width="84.5" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="120" y="64" font-size="11.5" text-anchor="middle">IPv4 header</text><rect x="350.75" y="48" width="58.5" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="380" y="64" font-size="11.5" text-anchor="middle">Payload</text><rect x="49.25" y="143" width="71.5" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="85" y="159" font-size="11.5" text-anchor="middle">IPv6 base</text><rect x="211" y="138.5" width="78" height="33" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="250" y="152.5" font-size="11.5" text-anchor="middle">Extensions</text><text x="250" y="165.5" font-size="11.5" text-anchor="middle">(optional)</text><rect x="385.75" y="143" width="58.5" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="415" y="159" font-size="11.5" text-anchor="middle">Payload</text></g><text x="18" y="270" font-size="13" fill="#cbd5e1">IPv4 20–60 bytes; IPv6 40-byte base header and optional extensions.</text></g><g transform="translate(565 737)"><rect width="540" height="312" rx="12" fill="#172235" stroke="#41536d"/><text x="18" y="29" font-size="19" font-weight="bold">6. IPsec tunnel</text><g transform="translate(20 48)"><path d="M65 110 L185 110" fill="none" stroke="#6ee7b7" stroke-width="2" /><path d="M185 110 L315 110" fill="none" stroke="#60a5fa" stroke-width="5" /><path d="M315 110 L435 110" fill="none" stroke="#6ee7b7" stroke-width="2" /><rect x="19.5" y="98" width="91" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="65" y="114" font-size="11.5" text-anchor="middle">Office A LAN</text><rect x="149.25" y="98" width="71.5" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="185" y="114" font-size="11.5" text-anchor="middle">Gateway A</text><rect x="279.25" y="98" width="71.5" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="315" y="114" font-size="11.5" text-anchor="middle">Gateway B</text><rect x="389.5" y="98" width="91" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="435" y="114" font-size="11.5" text-anchor="middle">Office B LAN</text></g><text x="18" y="270" font-size="13" fill="#cbd5e1">ESP can protect inner packet. Outer IP header routes the tunnel.</text></g><g transform="translate(15 1063)"><rect width="540" height="312" rx="12" fill="#172235" stroke="#41536d"/><text x="18" y="29" font-size="19" font-weight="bold">7. ICMP echo exchange</text><g transform="translate(20 48)"><path d="M100 35 L250 95" fill="none" stroke="#6ee7b7" stroke-width="2" /><path d="M250 95 L400 35" fill="none" stroke="#6ee7b7" stroke-width="2" /><path d="M400 35 L250 170" fill="none" stroke="#6ee7b7" stroke-width="2" /><path d="M250 170 L100 35" fill="none" stroke="#6ee7b7" stroke-width="2" /><rect x="72.5" y="23" width="55" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="100" y="39" font-size="11.5" text-anchor="middle">Host A</text><rect x="372.5" y="23" width="55" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="400" y="39" font-size="11.5" text-anchor="middle">Host B</text><rect x="204.5" y="83" width="91" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="250" y="99" font-size="11.5" text-anchor="middle">Echo request</text><rect x="211" y="158" width="78" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="250" y="174" font-size="11.5" text-anchor="middle">Echo reply</text></g><text x="18" y="270" font-size="13" fill="#cbd5e1">Echo Request and Reply support diagnostics, not service authorization.</text></g><g transform="translate(565 1063)"><rect width="540" height="312" rx="12" fill="#172235" stroke="#41536d"/><text x="18" y="29" font-size="19" font-weight="bold">8. IGMP multicast membership</text><g transform="translate(20 48)"><path d="M65 105 L240 105" fill="none" stroke="#6ee7b7" stroke-width="2" /><path d="M240 105 L435 30" fill="none" stroke="#6ee7b7" stroke-width="2" /><path d="M240 105 L435 105" fill="none" stroke="#6ee7b7" stroke-width="2" /><path d="M240 105 L435 180" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/><rect x="37.5" y="93" width="55" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="65" y="109" font-size="11.5" text-anchor="middle">Source</text><rect x="181.5" y="93" width="117" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="240" y="109" font-size="11.5" text-anchor="middle">Multicast router</text><rect x="389.5" y="18" width="91" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="435" y="34" font-size="11.5" text-anchor="middle">Subscriber A</text><rect x="389.5" y="93" width="91" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="435" y="109" font-size="11.5" text-anchor="middle">Subscriber B</text><rect x="396" y="168" width="78" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="435" y="184" font-size="11.5" text-anchor="middle">Non-member</text></g><text x="18" y="270" font-size="13" fill="#cbd5e1">Interested IPv4 hosts receive group traffic when forwarding is configured.</text></g><g transform="translate(15 1389)"><rect width="540" height="312" rx="12" fill="#172235" stroke="#41536d"/><text x="18" y="29" font-size="19" font-weight="bold">9. RIP vs OSPF path choice</text><g transform="translate(20 48)"><path d="M55 110 L250 35" fill="none" stroke="#fbbf24" stroke-width="2" /><text x="152.5" y="67.5" text-anchor="middle" font-size="12" fill="#fbbf24">10</text><path d="M250 35 L445 110" fill="none" stroke="#fbbf24" stroke-width="2" /><text x="347.5" y="67.5" text-anchor="middle" font-size="12" fill="#fbbf24">10</text><path d="M55 110 L175 185" fill="none" stroke="#34d399" stroke-width="2" /><text x="115" y="142.5" text-anchor="middle" font-size="12" fill="#34d399">5</text><path d="M175 185 L325 185" fill="none" stroke="#34d399" stroke-width="2" /><text x="250" y="180" text-anchor="middle" font-size="12" fill="#34d399">5</text><path d="M325 185 L445 110" fill="none" stroke="#34d399" stroke-width="2" /><text x="385" y="142.5" text-anchor="middle" font-size="12" fill="#34d399">5</text><rect x="27.5" y="98" width="55" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="55" y="114" font-size="11.5" text-anchor="middle">A</text><rect x="222.5" y="23" width="55" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="250" y="39" font-size="11.5" text-anchor="middle">B</text><rect x="417.5" y="98" width="55" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="445" y="114" font-size="11.5" text-anchor="middle">D</text><rect x="147.5" y="173" width="55" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="175" y="189" font-size="11.5" text-anchor="middle">C</text><rect x="297.5" y="173" width="55" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="325" y="189" font-size="11.5" text-anchor="middle">E</text></g><text x="18" y="270" font-size="13" fill="#cbd5e1">RIP: 2 links via B. OSPF: cost 15 via C/E instead of 20 via B.</text></g><g transform="translate(565 1389)"><rect width="540" height="312" rx="12" fill="#172235" stroke="#41536d"/><text x="18" y="29" font-size="19" font-weight="bold">10. UniTrack Layer 3 design</text><g transform="translate(20 48)"><path d="M85 30 L250 95" fill="none" stroke="#6ee7b7" stroke-width="2" /><path d="M250 30 L250 95" fill="none" stroke="#6ee7b7" stroke-width="2" /><path d="M415 30 L250 95" fill="none" stroke="#6ee7b7" stroke-width="2" /><path d="M250 95 L250 150" fill="none" stroke="#6ee7b7" stroke-width="2" /><path d="M250 150 L250 205" fill="none" stroke="#6ee7b7" stroke-width="2" /><rect x="39.5" y="18" width="91" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="85" y="34" font-size="11.5" text-anchor="middle">Scanner VLAN</text><rect x="211" y="18" width="78" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="250" y="34" font-size="11.5" text-anchor="middle">Admin VLAN</text><rect x="369.5" y="18" width="91" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="415" y="34" font-size="11.5" text-anchor="middle">Student VLAN</text><rect x="188.25" y="83" width="123.5" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="250" y="99" font-size="11.5" text-anchor="middle">Firewall / router</text><rect x="214.25" y="138" width="71.5" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="250" y="154" font-size="11.5" text-anchor="middle">HTTPS API</text><rect x="191.5" y="193" width="117" height="24" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="250" y="209" font-size="11.5" text-anchor="middle">Private database</text></g><text x="18" y="270" font-size="13" fill="#cbd5e1">Proposed VLAN routing and policy; database behind authorized API.</text></g></g></svg>