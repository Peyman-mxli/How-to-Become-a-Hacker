<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1400" viewBox="0 0 1120 1400" role="img"><title>11 MAC Addresses visual atlas</title><desc>Eight original MAC and ARP diagrams</desc><rect width="1120" height="1400" rx="12" fill="#0f172a"/><g font-family="Arial,sans-serif"><text x="25" y="37" font-size="26" fill="#f8fafc" text-anchor="start" font-weight="bold">11 — MAC Addresses</text><text x="25" y="64" font-size="15" fill="#cbd5e1" text-anchor="start">Original educational visual atlas — fictional addresses</text><g transform="translate(15 85)"><rect width="540" height="312" rx="12" fill="#172235" stroke="#41536d"/><text x="18" y="29" font-size="19" fill="#f8fafc" text-anchor="start" font-weight="bold">1. 48-bit MAC address</text><g transform="translate(5 40)"><rect x="8" y="55" width="80" height="66" rx="6" fill="#0f172a" stroke="#60a5fa"/><text x="48" y="83" font-size="22" fill="#e2e8f0" text-anchor="middle">DE</text><text x="48" y="106" font-size="12" fill="#e2e8f0" text-anchor="middle">11011110</text><rect x="94" y="55" width="80" height="66" rx="6" fill="#0f172a" stroke="#60a5fa"/><text x="134" y="83" font-size="22" fill="#e2e8f0" text-anchor="middle">AD</text><text x="134" y="106" font-size="12" fill="#e2e8f0" text-anchor="middle">10101101</text><rect x="180" y="55" width="80" height="66" rx="6" fill="#0f172a" stroke="#60a5fa"/><text x="220" y="83" font-size="22" fill="#e2e8f0" text-anchor="middle">BE</text><text x="220" y="106" font-size="12" fill="#e2e8f0" text-anchor="middle">10111110</text><rect x="266" y="55" width="80" height="66" rx="6" fill="#0f172a" stroke="#60a5fa"/><text x="306" y="83" font-size="22" fill="#e2e8f0" text-anchor="middle">EF</text><text x="306" y="106" font-size="12" fill="#e2e8f0" text-anchor="middle">11101111</text><rect x="352" y="55" width="80" height="66" rx="6" fill="#0f172a" stroke="#60a5fa"/><text x="392" y="83" font-size="22" fill="#e2e8f0" text-anchor="middle">13</text><text x="392" y="106" font-size="12" fill="#e2e8f0" text-anchor="middle">00010011</text><rect x="438" y="55" width="80" height="66" rx="6" fill="#0f172a" stroke="#60a5fa"/><text x="478" y="83" font-size="22" fill="#e2e8f0" text-anchor="middle">37</text><text x="478" y="106" font-size="12" fill="#e2e8f0" text-anchor="middle">00110111</text><text x="265" y="160" font-size="18" fill="#93c5fd" text-anchor="middle" font-weight="bold">6 octets × 8 bits = 48 bits</text></g><text x="18" y="294" font-size="12" fill="#cbd5e1" text-anchor="start">Each hexadecimal digit represents four bits.</text></g><g transform="translate(565 85)"><rect width="540" height="312" rx="12" fill="#172235" stroke="#41536d"/><text x="18" y="29" font-size="19" fill="#f8fafc" text-anchor="start" font-weight="bold">2. IEEE allocation and suffix</text><g transform="translate(5 40)"><rect x="12" y="55" width="250" height="60" rx="6" fill="#1e3a5f" stroke="#60a5fa"/><rect x="264" y="55" width="250" height="60" rx="6" fill="#124638" stroke="#34d399"/><text x="137" y="80" font-size="18" fill="#e2e8f0" text-anchor="middle">24-bit prefix</text><text x="137" y="100" font-size="13" fill="#e2e8f0" text-anchor="middle">MA-L example</text><text x="389" y="80" font-size="18" fill="#e2e8f0" text-anchor="middle">24-bit suffix</text><text x="389" y="100" font-size="13" fill="#e2e8f0" text-anchor="middle">Assigned by holder</text><text x="265" y="145" font-size="15" fill="#e2e8f0" text-anchor="middle">MA-M: 28 + 20 bits; MA-S: 36 + 12 bits</text><text x="265" y="178" font-size="13" fill="#e2e8f0" text-anchor="middle">Local DE:AD:BE is not evidence of a registered vendor.</text></g><text x="18" y="294" font-size="12" fill="#cbd5e1" text-anchor="start">Traditional prefix split is not universal for every allocation.</text></g><g transform="translate(15 411)"><rect width="540" height="312" rx="12" fill="#172235" stroke="#41536d"/><text x="18" y="29" font-size="19" fill="#f8fafc" text-anchor="start" font-weight="bold">3. First-octet classification</text><g transform="translate(5 40)"><rect x="12" y="55" width="59" height="55" rx="6" fill="#0f172a" stroke="#60a5fa"/><text x="41.5" y="88" font-size="22" fill="#e2e8f0" text-anchor="middle">1</text><rect x="76" y="55" width="59" height="55" rx="6" fill="#0f172a" stroke="#60a5fa"/><text x="105.5" y="88" font-size="22" fill="#e2e8f0" text-anchor="middle">1</text><rect x="140" y="55" width="59" height="55" rx="6" fill="#0f172a" stroke="#60a5fa"/><text x="169.5" y="88" font-size="22" fill="#e2e8f0" text-anchor="middle">0</text><rect x="204" y="55" width="59" height="55" rx="6" fill="#0f172a" stroke="#60a5fa"/><text x="233.5" y="88" font-size="22" fill="#e2e8f0" text-anchor="middle">1</text><rect x="268" y="55" width="59" height="55" rx="6" fill="#0f172a" stroke="#60a5fa"/><text x="297.5" y="88" font-size="22" fill="#e2e8f0" text-anchor="middle">1</text><rect x="332" y="55" width="59" height="55" rx="6" fill="#0f172a" stroke="#60a5fa"/><text x="361.5" y="88" font-size="22" fill="#e2e8f0" text-anchor="middle">1</text><rect x="396" y="55" width="59" height="55" rx="6" fill="#0f172a" stroke="#34d399"/><text x="425.5" y="88" font-size="22" fill="#e2e8f0" text-anchor="middle">1</text><rect x="460" y="55" width="59" height="55" rx="6" fill="#0f172a" stroke="#fbbf24"/><text x="489.5" y="88" font-size="22" fill="#e2e8f0" text-anchor="middle">0</text><text x="425" y="135" font-size="13" fill="#6ee7b7" text-anchor="middle">U/L = 1</text><text x="489" y="155" font-size="13" fill="#fbbf24" text-anchor="middle">I/G = 0</text><text x="265" y="190" font-size="18" fill="#e2e8f0" text-anchor="middle">DE = local individual (unicast)</text></g><text x="18" y="294" font-size="12" fill="#cbd5e1" text-anchor="start">U/L: universal/local; I/G: individual/group.</text></g><g transform="translate(565 411)"><rect width="540" height="312" rx="12" fill="#172235" stroke="#41536d"/><text x="18" y="29" font-size="19" fill="#f8fafc" text-anchor="start" font-weight="bold">4. Unicast, multicast, broadcast</text><g transform="translate(5 40)"><text x="92" y="18" font-size="15" fill="#e2e8f0" text-anchor="middle" font-weight="bold">Unicast</text><rect x="58" y="38" width="68" height="35" rx="6" fill="#0f172a" stroke="#60a5fa"/><text x="92" y="60" font-size="12" fill="#e2e8f0" text-anchor="middle">Switch</text><path d="M92 73L35 135" stroke="#34d399" stroke-width="2"  fill="none"/><rect x="13" y="135" width="44" height="30" rx="6" fill="#0f172a" stroke="#34d399"/><text x="35" y="154" font-size="12" fill="#e2e8f0" text-anchor="middle">A</text><path d="M92 73L92 135" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4" fill="none"/><rect x="70" y="135" width="44" height="30" rx="6" fill="#0f172a" stroke="#64748b"/><text x="92" y="154" font-size="12" fill="#e2e8f0" text-anchor="middle">B</text><path d="M92 73L149 135" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4" fill="none"/><rect x="127" y="135" width="44" height="30" rx="6" fill="#0f172a" stroke="#64748b"/><text x="149" y="154" font-size="12" fill="#e2e8f0" text-anchor="middle">C</text><text x="266" y="18" font-size="15" fill="#e2e8f0" text-anchor="middle" font-weight="bold">Multicast</text><rect x="232" y="38" width="68" height="35" rx="6" fill="#0f172a" stroke="#60a5fa"/><text x="266" y="60" font-size="12" fill="#e2e8f0" text-anchor="middle">Switch</text><path d="M266 73L209 135" stroke="#34d399" stroke-width="2"  fill="none"/><rect x="187" y="135" width="44" height="30" rx="6" fill="#0f172a" stroke="#34d399"/><text x="209" y="154" font-size="12" fill="#e2e8f0" text-anchor="middle">A</text><path d="M266 73L266 135" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4" fill="none"/><rect x="244" y="135" width="44" height="30" rx="6" fill="#0f172a" stroke="#64748b"/><text x="266" y="154" font-size="12" fill="#e2e8f0" text-anchor="middle">B</text><path d="M266 73L323 135" stroke="#34d399" stroke-width="2"  fill="none"/><rect x="301" y="135" width="44" height="30" rx="6" fill="#0f172a" stroke="#34d399"/><text x="323" y="154" font-size="12" fill="#e2e8f0" text-anchor="middle">C</text><text x="440" y="18" font-size="15" fill="#e2e8f0" text-anchor="middle" font-weight="bold">Broadcast</text><rect x="406" y="38" width="68" height="35" rx="6" fill="#0f172a" stroke="#60a5fa"/><text x="440" y="60" font-size="12" fill="#e2e8f0" text-anchor="middle">Switch</text><path d="M440 73L383 135" stroke="#34d399" stroke-width="2"  fill="none"/><rect x="361" y="135" width="44" height="30" rx="6" fill="#0f172a" stroke="#34d399"/><text x="383" y="154" font-size="12" fill="#e2e8f0" text-anchor="middle">A</text><path d="M440 73L440 135" stroke="#34d399" stroke-width="2"  fill="none"/><rect x="418" y="135" width="44" height="30" rx="6" fill="#0f172a" stroke="#34d399"/><text x="440" y="154" font-size="12" fill="#e2e8f0" text-anchor="middle">B</text><path d="M440 73L497 135" stroke="#34d399" stroke-width="2"  fill="none"/><rect x="475" y="135" width="44" height="30" rx="6" fill="#0f172a" stroke="#34d399"/><text x="497" y="154" font-size="12" fill="#e2e8f0" text-anchor="middle">C</text></g><text x="18" y="294" font-size="12" fill="#cbd5e1" text-anchor="start">Group forwarding depends on switch configuration and membership.</text></g><g transform="translate(15 737)"><rect width="540" height="312" rx="12" fill="#172235" stroke="#41536d"/><text x="18" y="29" font-size="19" fill="#f8fafc" text-anchor="start" font-weight="bold">5. Routed IP, local MAC</text><g transform="translate(5 40)"><rect x="8" y="55" width="150" height="65" rx="6" fill="#0f172a" stroke="#60a5fa"/><text x="83" y="76" font-size="14" fill="#e2e8f0" text-anchor="middle" font-weight="bold">Client</text><text x="83" y="95" font-size="12" fill="#e2e8f0" text-anchor="middle">192.0.2.10</text><rect x="190" y="55" width="150" height="65" rx="6" fill="#0f172a" stroke="#60a5fa"/><text x="265" y="76" font-size="14" fill="#e2e8f0" text-anchor="middle" font-weight="bold">Router</text><text x="265" y="95" font-size="12" fill="#e2e8f0" text-anchor="middle">Next-hop MAC</text><rect x="372" y="55" width="150" height="65" rx="6" fill="#0f172a" stroke="#60a5fa"/><text x="447" y="76" font-size="14" fill="#e2e8f0" text-anchor="middle" font-weight="bold">Server</text><text x="447" y="95" font-size="12" fill="#e2e8f0" text-anchor="middle">198.51.100.20</text><path d="M158 87L190 87" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M340 87L372 87" stroke="#6ee7b7" stroke-width="2"  fill="none"/><text x="265" y="153" font-size="15" fill="#e2e8f0" text-anchor="middle">Destination IP persists in ordinary routing.</text><text x="265" y="179" font-size="14" fill="#e2e8f0" text-anchor="middle">Link-layer frames are rebuilt for each hop.</text></g><text x="18" y="294" font-size="12" fill="#cbd5e1" text-anchor="start">NAT and tunnels may change or add addresses.</text></g><g transform="translate(565 737)"><rect width="540" height="312" rx="12" fill="#172235" stroke="#41536d"/><text x="18" y="29" font-size="19" fill="#f8fafc" text-anchor="start" font-weight="bold">6. ARP request and reply</text><g transform="translate(5 40)"><rect x="12" y="15" width="150" height="58" rx="6" fill="#0f172a" stroke="#60a5fa"/><text x="87" y="36" font-size="14" fill="#e2e8f0" text-anchor="middle" font-weight="bold">Host A</text><text x="87" y="55" font-size="12" fill="#e2e8f0" text-anchor="middle">192.0.2.10</text><rect x="368" y="15" width="150" height="58" rx="6" fill="#0f172a" stroke="#60a5fa"/><text x="443" y="36" font-size="14" fill="#e2e8f0" text-anchor="middle" font-weight="bold">Host B</text><text x="443" y="55" font-size="12" fill="#e2e8f0" text-anchor="middle">192.0.2.20</text><path d="M87 73L87 194" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4" fill="none"/><path d="M443 73L443 194" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4" fill="none"/><path d="M87 105L443 105" stroke="#6ee7b7" stroke-width="2"  fill="none"/><text x="265" y="98" font-size="14" fill="#e2e8f0" text-anchor="middle">Broadcast: who has 192.0.2.20?</text><path d="M443 153L87 153" stroke="#60a5fa" stroke-width="2"  fill="none"/><text x="265" y="146" font-size="14" fill="#e2e8f0" text-anchor="middle">Reply: 02:00:00:00:00:14</text><text x="265" y="200" font-size="14" fill="#e2e8f0" text-anchor="middle">A learns IP-to-MAC mapping.</text></g><text x="18" y="294" font-size="12" fill="#cbd5e1" text-anchor="start">ARP request normally broadcast; reply normally unicast.</text></g><g transform="translate(15 1063)"><rect width="540" height="312" rx="12" fill="#172235" stroke="#41536d"/><text x="18" y="29" font-size="19" fill="#f8fafc" text-anchor="start" font-weight="bold">7. Ethernet ARP payload</text><g transform="translate(5 40)"><rect x="10" y="35" width="120" height="55" rx="6" fill="#0f172a" stroke="#60a5fa"/><text x="70" y="56" font-size="14" fill="#e2e8f0" text-anchor="middle" font-weight="bold">Hardware type</text><text x="70" y="75" font-size="12" fill="#e2e8f0" text-anchor="middle">2 bytes</text><rect x="140" y="35" width="120" height="55" rx="6" fill="#0f172a" stroke="#60a5fa"/><text x="200" y="56" font-size="14" fill="#e2e8f0" text-anchor="middle" font-weight="bold">Protocol type</text><text x="200" y="75" font-size="12" fill="#e2e8f0" text-anchor="middle">2 bytes</text><rect x="270" y="35" width="120" height="55" rx="6" fill="#0f172a" stroke="#60a5fa"/><text x="330" y="56" font-size="14" fill="#e2e8f0" text-anchor="middle" font-weight="bold">HLEN / PLEN</text><text x="330" y="75" font-size="12" fill="#e2e8f0" text-anchor="middle">2 bytes</text><rect x="400" y="35" width="120" height="55" rx="6" fill="#0f172a" stroke="#60a5fa"/><text x="460" y="56" font-size="14" fill="#e2e8f0" text-anchor="middle" font-weight="bold">Opcode</text><text x="460" y="75" font-size="12" fill="#e2e8f0" text-anchor="middle">2 bytes</text><rect x="10" y="109" width="120" height="55" rx="6" fill="#0f172a" stroke="#60a5fa"/><text x="70" y="130" font-size="14" fill="#e2e8f0" text-anchor="middle" font-weight="bold">Sender MAC</text><text x="70" y="149" font-size="12" fill="#e2e8f0" text-anchor="middle">6 bytes</text><rect x="140" y="109" width="120" height="55" rx="6" fill="#0f172a" stroke="#60a5fa"/><text x="200" y="130" font-size="14" fill="#e2e8f0" text-anchor="middle" font-weight="bold">Sender IP</text><text x="200" y="149" font-size="12" fill="#e2e8f0" text-anchor="middle">4 bytes</text><rect x="270" y="109" width="120" height="55" rx="6" fill="#0f172a" stroke="#60a5fa"/><text x="330" y="130" font-size="14" fill="#e2e8f0" text-anchor="middle" font-weight="bold">Target MAC</text><text x="330" y="149" font-size="12" fill="#e2e8f0" text-anchor="middle">6 bytes</text><rect x="400" y="109" width="120" height="55" rx="6" fill="#0f172a" stroke="#60a5fa"/><text x="460" y="130" font-size="14" fill="#e2e8f0" text-anchor="middle" font-weight="bold">Target IP</text><text x="460" y="149" font-size="12" fill="#e2e8f0" text-anchor="middle">4 bytes</text><text x="265" y="194" font-size="15" fill="#e2e8f0" text-anchor="middle">28 bytes of ARP payload; Ethernet EtherType 0x0806</text></g><text x="18" y="294" font-size="12" fill="#cbd5e1" text-anchor="start">Ethernet/IPv4 ARP is not an IPv4 packet and has no ports.</text></g><g transform="translate(565 1063)"><rect width="540" height="312" rx="12" fill="#172235" stroke="#41536d"/><text x="18" y="29" font-size="19" fill="#f8fafc" text-anchor="start" font-weight="bold">8. Defensive UniTrack architecture</text><g transform="translate(5 40)"><rect x="10" y="40" width="160" height="58" rx="6" fill="#0f172a" stroke="#60a5fa"/><text x="90" y="61" font-size="14" fill="#e2e8f0" text-anchor="middle" font-weight="bold">QR scanner</text><text x="90" y="80" font-size="12" fill="#e2e8f0" text-anchor="middle">Device credentials</text><rect x="190" y="40" width="160" height="58" rx="6" fill="#0f172a" stroke="#60a5fa"/><text x="270" y="61" font-size="14" fill="#e2e8f0" text-anchor="middle" font-weight="bold">Switch / VLAN</text><text x="270" y="80" font-size="12" fill="#e2e8f0" text-anchor="middle">802.1X / DAI</text><rect x="370" y="40" width="150" height="58" rx="6" fill="#0f172a" stroke="#60a5fa"/><text x="445" y="61" font-size="14" fill="#e2e8f0" text-anchor="middle" font-weight="bold">Router / firewall</text><text x="445" y="80" font-size="12" fill="#e2e8f0" text-anchor="middle">Approved policy</text><path d="M170 69L190 69" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M350 69L370 69" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M445 98L445 123" stroke="#6ee7b7" stroke-width="2"  fill="none"/><rect x="370" y="123" width="150" height="58" rx="6" fill="#0f172a" stroke="#60a5fa"/><text x="445" y="144" font-size="14" fill="#e2e8f0" text-anchor="middle" font-weight="bold">HTTPS API</text><text x="445" y="163" font-size="12" fill="#e2e8f0" text-anchor="middle">Authorization</text><path d="M370 152L350 152" stroke="#6ee7b7" stroke-width="2"  fill="none"/><rect x="190" y="123" width="160" height="58" rx="6" fill="#0f172a" stroke="#60a5fa"/><text x="270" y="144" font-size="14" fill="#e2e8f0" text-anchor="middle" font-weight="bold">Private DB</text><text x="270" y="163" font-size="12" fill="#e2e8f0" text-anchor="middle">Approved backend</text></g><text x="18" y="294" font-size="12" fill="#cbd5e1" text-anchor="start">MAC address alone is not a secure identity.</text></g></g></svg>