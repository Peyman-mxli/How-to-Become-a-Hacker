<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1400" viewBox="0 0 1120 1400" role="img"><title>12 IPv6 Addresses visual atlas</title><desc>Eight original IPv6 addressing diagrams</desc><rect width="1120" height="1400" rx="12" fill="#0f172a"/><g font-family="Arial,sans-serif"><text x="25" y="37" font-size="26" fill="#f8fafc" text-anchor="start" font-weight="bold">12 — IPv6 Addresses</text><text x="25" y="64" font-size="15" fill="#cbd5e1" text-anchor="start">Original educational visual atlas — documentation examples</text><g transform="translate(15 85)"><rect width="540" height="312" rx="12" fill="#172235" stroke="#41536d"/><text x="18" y="29" font-size="19" fill="#f8fafc" text-anchor="start" font-weight="bold">1. IPv4 versus IPv6 length</text><g transform="translate(5 40)"><text x="10" y="20" font-size="15" fill="#93c5fd" text-anchor="start" font-weight="bold">IPv4: 32 bits</text><rect x="10" y="30" width="59" height="35" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="39.5" y="52" font-size="16" fill="#e2e8f0" text-anchor="middle">192</text><rect x="73" y="30" width="59" height="35" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="102.5" y="52" font-size="16" fill="#e2e8f0" text-anchor="middle">168</text><rect x="136" y="30" width="59" height="35" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="165.5" y="52" font-size="16" fill="#e2e8f0" text-anchor="middle">12</text><rect x="199" y="30" width="59" height="35" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="228.5" y="52" font-size="16" fill="#e2e8f0" text-anchor="middle">160</text><text x="10" y="95" font-size="15" fill="#6ee7b7" text-anchor="start" font-weight="bold">IPv6: 128 bits</text><rect x="10" y="108" width="60" height="40" rx="5" fill="#0f172a" stroke="#34d399"/><text x="40" y="133" font-size="14" fill="#e2e8f0" text-anchor="middle">fe80</text><rect x="74" y="108" width="60" height="40" rx="5" fill="#0f172a" stroke="#34d399"/><text x="104" y="133" font-size="14" fill="#e2e8f0" text-anchor="middle">0000</text><rect x="138" y="108" width="60" height="40" rx="5" fill="#0f172a" stroke="#34d399"/><text x="168" y="133" font-size="14" fill="#e2e8f0" text-anchor="middle">0000</text><rect x="202" y="108" width="60" height="40" rx="5" fill="#0f172a" stroke="#34d399"/><text x="232" y="133" font-size="14" fill="#e2e8f0" text-anchor="middle">0000</text><rect x="266" y="108" width="60" height="40" rx="5" fill="#0f172a" stroke="#34d399"/><text x="296" y="133" font-size="14" fill="#e2e8f0" text-anchor="middle">dd80</text><rect x="330" y="108" width="60" height="40" rx="5" fill="#0f172a" stroke="#34d399"/><text x="360" y="133" font-size="14" fill="#e2e8f0" text-anchor="middle">b1a9</text><rect x="394" y="108" width="60" height="40" rx="5" fill="#0f172a" stroke="#34d399"/><text x="424" y="133" font-size="14" fill="#e2e8f0" text-anchor="middle">6687</text><rect x="458" y="108" width="60" height="40" rx="5" fill="#0f172a" stroke="#34d399"/><text x="488" y="133" font-size="14" fill="#e2e8f0" text-anchor="middle">2d3b</text><text x="265" y="182" font-size="15" fill="#e2e8f0" text-anchor="middle">4 octets × 8 bits  |  8 hextets × 16 bits</text></g><text x="18" y="294" font-size="11.5" fill="#cbd5e1" text-anchor="start">Address-space ratio is 2^96, not four times.</text></g><g transform="translate(565 85)"><rect width="540" height="312" rx="12" fill="#172235" stroke="#41536d"/><text x="18" y="29" font-size="19" fill="#f8fafc" text-anchor="start" font-weight="bold">2. Dual stack</text><g transform="translate(5 40)"><rect x="165" y="10" width="200" height="55" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="265" y="31" font-size="14" fill="#e2e8f0" text-anchor="middle" font-weight="bold">Dual-stack host</text><text x="265" y="50" font-size="12" fill="#e2e8f0" text-anchor="middle">Both protocol families</text><path d="M265 65 L130 95" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M265 65 L400 95" stroke="#6ee7b7" stroke-width="2"  fill="none"/><rect x="35" y="95" width="190" height="55" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="130" y="116" font-size="14" fill="#e2e8f0" text-anchor="middle" font-weight="bold">IPv4 stack</text><text x="130" y="135" font-size="12" fill="#e2e8f0" text-anchor="middle">192.168.1.10</text><rect x="305" y="95" width="190" height="55" rx="5" fill="#0f172a" stroke="#34d399"/><text x="400" y="116" font-size="14" fill="#e2e8f0" text-anchor="middle" font-weight="bold">IPv6 stack</text><text x="400" y="135" font-size="12" fill="#e2e8f0" text-anchor="middle">2001:db8::10</text><path d="M130 150 L130 180" stroke="#6ee7b7" stroke-width="2"  fill="none"/><path d="M400 150 L400 180" stroke="#6ee7b7" stroke-width="2"  fill="none"/><text x="130" y="200" font-size="14" fill="#e2e8f0" text-anchor="middle">IPv4 network / A</text><text x="400" y="200" font-size="14" fill="#e2e8f0" text-anchor="middle">IPv6 network / AAAA</text></g><text x="18" y="294" font-size="11.5" fill="#cbd5e1" text-anchor="start">Separate packet families; enforce firewall policy for both.</text></g><g transform="translate(15 411)"><rect width="540" height="312" rx="12" fill="#172235" stroke="#41536d"/><text x="18" y="29" font-size="19" fill="#f8fafc" text-anchor="start" font-weight="bold">3. Unicast, anycast and multicast</text><g transform="translate(5 40)"><text x="92" y="20" font-size="15" fill="#e2e8f0" text-anchor="middle" font-weight="bold">Unicast</text><rect x="55" y="40" width="74" height="32" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="92" y="60" font-size="12" fill="#e2e8f0" text-anchor="middle">Sender</text><path d="M92 72 L35 135" stroke="#34d399" stroke-width="2"  fill="none"/><rect x="13" y="135" width="44" height="30" rx="5" fill="#0f172a" stroke="#34d399"/><text x="35" y="154" font-size="12" fill="#e2e8f0" text-anchor="middle">A</text><path d="M92 72 L92 135" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4" fill="none"/><rect x="70" y="135" width="44" height="30" rx="5" fill="#0f172a" stroke="#64748b"/><text x="92" y="154" font-size="12" fill="#e2e8f0" text-anchor="middle">B</text><path d="M92 72 L149 135" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4" fill="none"/><rect x="127" y="135" width="44" height="30" rx="5" fill="#0f172a" stroke="#64748b"/><text x="149" y="154" font-size="12" fill="#e2e8f0" text-anchor="middle">C</text><text x="266" y="20" font-size="15" fill="#e2e8f0" text-anchor="middle" font-weight="bold">Anycast</text><rect x="229" y="40" width="74" height="32" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="266" y="60" font-size="12" fill="#e2e8f0" text-anchor="middle">Sender</text><path d="M266 72 L209 135" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4" fill="none"/><rect x="187" y="135" width="44" height="30" rx="5" fill="#0f172a" stroke="#64748b"/><text x="209" y="154" font-size="12" fill="#e2e8f0" text-anchor="middle">A</text><path d="M266 72 L266 135" stroke="#34d399" stroke-width="2"  fill="none"/><rect x="244" y="135" width="44" height="30" rx="5" fill="#0f172a" stroke="#34d399"/><text x="266" y="154" font-size="12" fill="#e2e8f0" text-anchor="middle">B</text><path d="M266 72 L323 135" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4" fill="none"/><rect x="301" y="135" width="44" height="30" rx="5" fill="#0f172a" stroke="#64748b"/><text x="323" y="154" font-size="12" fill="#e2e8f0" text-anchor="middle">C</text><text x="440" y="20" font-size="15" fill="#e2e8f0" text-anchor="middle" font-weight="bold">Multicast</text><rect x="403" y="40" width="74" height="32" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="440" y="60" font-size="12" fill="#e2e8f0" text-anchor="middle">Sender</text><path d="M440 72 L383 135" stroke="#34d399" stroke-width="2"  fill="none"/><rect x="361" y="135" width="44" height="30" rx="5" fill="#0f172a" stroke="#34d399"/><text x="383" y="154" font-size="12" fill="#e2e8f0" text-anchor="middle">A</text><path d="M440 72 L440 135" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4" fill="none"/><rect x="418" y="135" width="44" height="30" rx="5" fill="#0f172a" stroke="#64748b"/><text x="440" y="154" font-size="12" fill="#e2e8f0" text-anchor="middle">B</text><path d="M440 72 L497 135" stroke="#34d399" stroke-width="2"  fill="none"/><rect x="475" y="135" width="44" height="30" rx="5" fill="#0f172a" stroke="#34d399"/><text x="497" y="154" font-size="12" fill="#e2e8f0" text-anchor="middle">C</text></g><text x="18" y="294" font-size="11.5" fill="#cbd5e1" text-anchor="start">Anycast selects one member according to routing; IPv6 has no broadcast.</text></g><g transform="translate(565 411)"><rect width="540" height="312" rx="12" fill="#172235" stroke="#41536d"/><text x="18" y="29" font-size="19" fill="#f8fafc" text-anchor="start" font-weight="bold">4. Decimal, binary and hexadecimal</text><g transform="translate(5 40)"><text x="10" y="13" font-size="12" fill="#cbd5e1" text-anchor="start">Decimal</text><rect x="10" y="20" width="122" height="35" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="71" y="42" font-size="18" fill="#e2e8f0" text-anchor="middle">192</text><rect x="140" y="20" width="122" height="35" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="201" y="42" font-size="18" fill="#e2e8f0" text-anchor="middle">168</text><rect x="270" y="20" width="122" height="35" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="331" y="42" font-size="18" fill="#e2e8f0" text-anchor="middle">12</text><rect x="400" y="20" width="122" height="35" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="461" y="42" font-size="18" fill="#e2e8f0" text-anchor="middle">160</text><text x="10" y="75" font-size="12" fill="#cbd5e1" text-anchor="start">Binary</text><rect x="10" y="82" width="122" height="35" rx="5" fill="#0f172a" stroke="#22d3ee"/><text x="71" y="104" font-size="13" fill="#e2e8f0" text-anchor="middle">11000000</text><rect x="140" y="82" width="122" height="35" rx="5" fill="#0f172a" stroke="#22d3ee"/><text x="201" y="104" font-size="13" fill="#e2e8f0" text-anchor="middle">10101000</text><rect x="270" y="82" width="122" height="35" rx="5" fill="#0f172a" stroke="#22d3ee"/><text x="331" y="104" font-size="13" fill="#e2e8f0" text-anchor="middle">00001100</text><rect x="400" y="82" width="122" height="35" rx="5" fill="#0f172a" stroke="#22d3ee"/><text x="461" y="104" font-size="13" fill="#e2e8f0" text-anchor="middle">10100000</text><text x="10" y="137" font-size="12" fill="#cbd5e1" text-anchor="start">Hex</text><rect x="10" y="144" width="122" height="35" rx="5" fill="#0f172a" stroke="#34d399"/><text x="71" y="166" font-size="18" fill="#e2e8f0" text-anchor="middle">C0</text><rect x="140" y="144" width="122" height="35" rx="5" fill="#0f172a" stroke="#34d399"/><text x="201" y="166" font-size="18" fill="#e2e8f0" text-anchor="middle">A8</text><rect x="270" y="144" width="122" height="35" rx="5" fill="#0f172a" stroke="#34d399"/><text x="331" y="166" font-size="18" fill="#e2e8f0" text-anchor="middle">0C</text><rect x="400" y="144" width="122" height="35" rx="5" fill="#0f172a" stroke="#34d399"/><text x="461" y="166" font-size="18" fill="#e2e8f0" text-anchor="middle">A0</text></g><text x="18" y="294" font-size="11.5" fill="#cbd5e1" text-anchor="start">Each hex digit is four bits; C0 = 192.</text></g><g transform="translate(15 737)"><rect width="540" height="312" rx="12" fill="#172235" stroke="#41536d"/><text x="18" y="29" font-size="19" fill="#f8fafc" text-anchor="start" font-weight="bold">5. IPv6 compression</text><g transform="translate(5 40)"><text x="265" y="23" font-size="16" fill="#e2e8f0" text-anchor="middle">fe80:0000:0000:0000:dd80:b1a9:6687:2d3b</text><path d="M265 36 L265 62" stroke="#6ee7b7" stroke-width="2"  fill="none"/><text x="265" y="83" font-size="17" fill="#e2e8f0" text-anchor="middle">fe80:0:0:0:dd80:b1a9:6687:2d3b</text><path d="M265 95 L265 122" stroke="#6ee7b7" stroke-width="2"  fill="none"/><rect x="30" y="122" width="470" height="50" rx="5" fill="#0f172a" stroke="#34d399"/><text x="265" y="152" font-size="20" fill="#6ee7b7" text-anchor="middle" font-weight="bold">fe80::dd80:b1a9:6687:2d3b</text><text x="265" y="196" font-size="14" fill="#e2e8f0" text-anchor="middle">Longest zero run; first only when tied.</text></g><text x="18" y="294" font-size="11.5" fill="#cbd5e1" text-anchor="start">Lowercase; omit leading zeros; compress once, never a single group canonically.</text></g><g transform="translate(565 737)"><rect width="540" height="312" rx="12" fill="#172235" stroke="#41536d"/><text x="18" y="29" font-size="19" fill="#f8fafc" text-anchor="start" font-weight="bold">6. /64 prefix and interface identifier</text><g transform="translate(5 40)"><rect x="10" y="65" width="60" height="45" rx="5" fill="#1e3a5f" stroke="#60a5fa"/><text x="40" y="93" font-size="14" fill="#e2e8f0" text-anchor="middle">fe80</text><rect x="74" y="65" width="60" height="45" rx="5" fill="#1e3a5f" stroke="#60a5fa"/><text x="104" y="93" font-size="14" fill="#e2e8f0" text-anchor="middle">0000</text><rect x="138" y="65" width="60" height="45" rx="5" fill="#1e3a5f" stroke="#60a5fa"/><text x="168" y="93" font-size="14" fill="#e2e8f0" text-anchor="middle">0000</text><rect x="202" y="65" width="60" height="45" rx="5" fill="#1e3a5f" stroke="#60a5fa"/><text x="232" y="93" font-size="14" fill="#e2e8f0" text-anchor="middle">0000</text><rect x="266" y="65" width="60" height="45" rx="5" fill="#124638" stroke="#34d399"/><text x="296" y="93" font-size="14" fill="#e2e8f0" text-anchor="middle">dd80</text><rect x="330" y="65" width="60" height="45" rx="5" fill="#124638" stroke="#34d399"/><text x="360" y="93" font-size="14" fill="#e2e8f0" text-anchor="middle">b1a9</text><rect x="394" y="65" width="60" height="45" rx="5" fill="#124638" stroke="#34d399"/><text x="424" y="93" font-size="14" fill="#e2e8f0" text-anchor="middle">6687</text><rect x="458" y="65" width="60" height="45" rx="5" fill="#124638" stroke="#34d399"/><text x="488" y="93" font-size="14" fill="#e2e8f0" text-anchor="middle">2d3b</text><text x="136" y="44" font-size="18" fill="#93c5fd" text-anchor="middle">64-bit prefix</text><text x="392" y="44" font-size="18" fill="#6ee7b7" text-anchor="middle">64-bit IID</text><text x="136" y="143" font-size="15" fill="#e2e8f0" text-anchor="middle">fe80::/64</text><text x="392" y="143" font-size="13" fill="#e2e8f0" text-anchor="middle">dd80:b1a9:6687:2d3b</text><text x="265" y="187" font-size="14" fill="#e2e8f0" text-anchor="middle">Link-local example; other prefix lengths exist.</text></g><text x="18" y="294" font-size="11.5" fill="#cbd5e1" text-anchor="start">Modern identifiers need not contain a hardware MAC.</text></g><g transform="translate(15 1063)"><rect width="540" height="312" rx="12" fill="#172235" stroke="#41536d"/><text x="18" y="29" font-size="19" fill="#f8fafc" text-anchor="start" font-weight="bold">7. SLAAC and historical EUI-64</text><g transform="translate(5 40)"><rect x="10" y="12" width="164" height="38" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="92" y="36" font-size="13" fill="#e2e8f0" text-anchor="middle">Link-local + DAD</text><path d="M174 31 L184 31" stroke="#6ee7b7" stroke-width="2"  fill="none"/><rect x="184" y="12" width="164" height="38" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="266" y="36" font-size="13" fill="#e2e8f0" text-anchor="middle">Router advertisement</text><path d="M348 31 L358 31" stroke="#6ee7b7" stroke-width="2"  fill="none"/><rect x="358" y="12" width="164" height="38" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="440" y="36" font-size="13" fill="#e2e8f0" text-anchor="middle">Address + DAD</text><text x="265" y="78" font-size="13" fill="#e2e8f0" text-anchor="middle">Historical MAC-based method (not default recommendation)</text><text x="265" y="108" font-size="18" fill="#e2e8f0" text-anchor="middle">00:11:22:33:44:55</text><text x="265" y="138" font-size="15" fill="#e2e8f0" text-anchor="middle">Insert ff:fe; first byte XOR 02</text><text x="265" y="173" font-size="20" fill="#6ee7b7" text-anchor="middle" font-weight="bold">0211:22ff:fe33:4455</text><text x="265" y="199" font-size="13" fill="#e2e8f0" text-anchor="middle">Opaque and temporary IIDs are also available.</text></g><text x="18" y="294" font-size="11.5" fill="#cbd5e1" text-anchor="start">SLAAC learns eligible prefixes; RA supplies default-router information.</text></g><g transform="translate(565 1063)"><rect width="540" height="312" rx="12" fill="#172235" stroke="#41536d"/><text x="18" y="29" font-size="19" fill="#f8fafc" text-anchor="start" font-weight="bold">8. /56 allocation and UniTrack design</text><g transform="translate(5 40)"><rect x="75" y="8" width="380" height="55" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="265" y="29" font-size="14" fill="#e2e8f0" text-anchor="middle" font-weight="bold">2001:db8:1234:ab00::/56</text><text x="265" y="48" font-size="12" fill="#e2e8f0" text-anchor="middle">256 possible /64 subnets</text><path d="M265 63 L70 112" stroke="#6ee7b7" stroke-width="2"  fill="none"/><rect x="10" y="112" width="120" height="56" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="70" y="135" font-size="12" fill="#e2e8f0" text-anchor="middle">Scanner ab00</text><text x="70" y="152" font-size="13" fill="#e2e8f0" text-anchor="middle">/64</text><path d="M265 63 L200 112" stroke="#6ee7b7" stroke-width="2"  fill="none"/><rect x="140" y="112" width="120" height="56" rx="5" fill="#0f172a" stroke="#22d3ee"/><text x="200" y="135" font-size="12" fill="#e2e8f0" text-anchor="middle">Admin ab01</text><text x="200" y="152" font-size="13" fill="#e2e8f0" text-anchor="middle">/64</text><path d="M265 63 L330 112" stroke="#6ee7b7" stroke-width="2"  fill="none"/><rect x="270" y="112" width="120" height="56" rx="5" fill="#0f172a" stroke="#a78bfa"/><text x="330" y="135" font-size="12" fill="#e2e8f0" text-anchor="middle">Student ab02</text><text x="330" y="152" font-size="13" fill="#e2e8f0" text-anchor="middle">/64</text><path d="M265 63 L460 112" stroke="#6ee7b7" stroke-width="2"  fill="none"/><rect x="400" y="112" width="120" height="56" rx="5" fill="#0f172a" stroke="#34d399"/><text x="460" y="135" font-size="12" fill="#e2e8f0" text-anchor="middle">Service ab03</text><text x="460" y="152" font-size="13" fill="#e2e8f0" text-anchor="middle">/64</text><text x="265" y="195" font-size="14" fill="#e2e8f0" text-anchor="middle">ab04 through abff remain available for planning.</text></g><text x="18" y="294" font-size="11.5" fill="#cbd5e1" text-anchor="start">Documentation prefix only; enforce routing, firewall and application policy.</text></g></g></svg>